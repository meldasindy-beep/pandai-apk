    function renderSupplierPortal() {
      const supplier = State.currentUser;
      if (!supplier || supplier.role !== 'supplier') {
        showToast('Akses ditolak: Portal ini khusus rekanan Supplier terdaftar.', 'danger');
        logout();
        return '';
      }

      const supplierTab = State.supplierTab || 'products';
      const myProducts = State.products.filter(p => p.supplierId === supplier.id);

      // Pesanan yang memuat produk dari Supplier ini
      const myOrders = State.orders.filter(order => {
        if (order.supplierIds && order.supplierIds.includes(supplier.id)) return true;
        if (order.items && order.items.some(it => it.supplierId === supplier.id)) return true;
        return false;
      });
      const pendingOrdersCount = myOrders.filter(o => {
        const conf = o.supplierConfirmations && o.supplierConfirmations[supplier.id];
        const isPending = !conf || conf.status === 'Menunggu Konfirmasi';
        return isPending && o.status !== 'Ditolak' && o.status !== 'Dibatalkan';
      }).length;

      return `
        <div class="py-2">
          <!-- Supplier Header Banner -->
          <div class="pandai-card p-3 mb-3 border-0 shadow-sm" style="background: linear-gradient(135deg, #0f5132 0%, #198754 100%); color: white;">
            <div class="d-flex align-items-center gap-3">
              <div class="rounded-circle bg-white text-success d-flex align-items-center justify-content-center shadow-sm" style="width: 56px; height: 56px; font-size: 1.7rem; flex-shrink: 0;">
                <i class="bi bi-truck-flatbed"></i>
              </div>
              <div class="flex-grow-1 overflow-hidden">
                <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                  <span class="badge bg-warning text-dark px-2 py-1" style="font-size:0.68rem;">
                    <i class="bi bi-patch-check-fill me-1"></i>${supplier.accountStatus || 'Terverifikasi Koperasi'}
                  </span>
                  <span class="badge bg-white text-success px-2 py-1" style="font-size:0.68rem;">
                    Mitra Pemasok Resmi
                  </span>
                </div>
                <h5 class="fw-bold mb-0 text-white text-truncate">${supplier.businessName || 'Supplier PANDAI'}</h5>
                <p class="mb-0 text-white-50 small" style="font-size:0.75rem;">Penanggung Jawab: <span class="text-white fw-semibold">${supplier.name}</span></p>
              </div>
            </div>
          </div>

          <!-- Supplier Sub-Navigation Tabs -->
          <div class="category-scroll mb-3">
            <div class="category-chip ${supplierTab === 'products' ? 'active' : ''}" onclick="setSupplierTab('products')">
              <i class="bi bi-box-seam me-1"></i> Produk Saya (${myProducts.length})
            </div>
            <div class="category-chip ${supplierTab === 'orders' ? 'active' : ''}" onclick="setSupplierTab('orders')">
              <i class="bi bi-inbox-fill me-1"></i> Pesanan Masuk
              ${pendingOrdersCount > 0 ? `<span class="badge bg-danger rounded-pill ms-1" style="font-size:0.68rem;">${pendingOrdersCount}</span>` : ''}
            </div>
            <div class="category-chip ${supplierTab === 'profile' ? 'active' : ''}" onclick="setSupplierTab('profile')">
              <i class="bi bi-building me-1"></i> Profil Usaha
            </div>
          </div>

          ${supplierTab === 'products' 
            ? renderSupplierProductsView(supplier, myProducts) 
            : supplierTab === 'orders' 
              ? renderSupplierOrdersView(supplier, myOrders) 
              : renderSupplierProfileView(supplier)}
        </div>
      `;

    // Foto Helper: Preview Unggah Gambar & Preset
    function previewSupplierUploadedImage(fileInputId, urlInputId, previewImgId) {
      const fileInput = document.getElementById(fileInputId);
      const urlInput = document.getElementById(urlInputId);
      const previewImg = document.getElementById(previewImgId);
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        if (!file.type.startsWith('image/')) {
          showToast('Harap pilih file gambar yang valid (JPG, PNG, WEBP).', 'warning');
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          showToast('Ukuran gambar maksimal 2MB.', 'warning');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          if (urlInput) urlInput.value = dataUrl;
          if (previewImg) {
            previewImg.src = dataUrl;
            previewImg.style.display = 'block';
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function applySupplierPresetImage(presetUrl, urlInputId, previewImgId) {
      const urlInput = document.getElementById(urlInputId);
      const previewImg = document.getElementById(previewImgId);
      if (urlInput) urlInput.value = presetUrl;
      if (previewImg) {
        previewImg.src = presetUrl;
        previewImg.style.display = 'block';
      }
      showToast('Preset foto sembako dipilih!', 'info');
    }

    function handleSupplierAddProductSubmit(e) {
      e.preventDefault();
      if (!State.currentUser || State.currentUser.role !== 'supplier') {
        showToast('Akses ditolak: Hanya akun Supplier yang berhak menambah produk!', 'danger');
        return;
      }

      const name = document.getElementById('supAddProdName').value.trim();
      const category = document.getElementById('supAddProdCat').value;
      const supplierPrice = Number(document.getElementById('supAddProdPrice').value);
      const normalPriceInput = Number(document.getElementById('supAddProdNormalPrice').value);
      const normalPrice = normalPriceInput > supplierPrice ? normalPriceInput : Math.round(supplierPrice * 1.1);
      const stock = Number(document.getElementById('supAddProdStock').value);
      const unit = document.getElementById('supAddProdUnit').value.trim();
      const desc = document.getElementById('supAddProdDesc').value.trim();
      const image = document.getElementById('supAddProdImg').value.trim() || 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80';

      if (supplierPrice <= 0 || stock < 0) {
        showToast('Harga grosir dan stok harus angka positif yang valid.', 'warning');
        return;
      }

      const newProd = {
        id: 'prod_' + Date.now(),
        supplierId: State.currentUser.id,
        supplierName: State.currentUser.businessName || State.currentUser.name,
        name,
        category,
        supplierPrice,
        normalPrice,
        stock,
        unit,
        desc: desc || `Pasokan sembako berkualitas dari ${State.currentUser.businessName || 'Supplier Mitra'}.`,
        image,
        badge: 'Produk Baru',
        rating: 5.0,
        soldCount: 0
      };

      State.products.unshift(newProd);
      State.saveProducts();
      closeModal();
      showToast(`Produk "${name}" berhasil ditambahkan ke etalase dan katalog UMKM!`, 'success');
      renderApp();
    }

    function handleSupplierEditProductSubmit(e, prodId) {
      e.preventDefault();
      if (!State.currentUser || State.currentUser.role !== 'supplier') {
        showToast('Akses ditolak: Khusus akun Supplier!', 'danger');
        return;
      }
      const prod = State.products.find(p => p.id === prodId);
      if (!prod) {
        showToast('Produk tidak ditemukan.', 'danger');
        return;
      }
      // Strict ownership check
      if (prod.supplierId !== State.currentUser.id) {
        showToast('Akses ditolak: Anda tidak memiliki izin untuk mengedit produk milik Supplier lain!', 'danger');
        return;
      }

      const name = document.getElementById('supEditProdName').value.trim();
      const category = document.getElementById('supEditProdCat').value;
      const supplierPrice = Number(document.getElementById('supEditProdPrice').value);
      const normalPriceInput = Number(document.getElementById('supEditProdNormalPrice').value);
      const normalPrice = normalPriceInput > supplierPrice ? normalPriceInput : Math.round(supplierPrice * 1.1);
      const stock = Number(document.getElementById('supEditProdStock').value);
      const unit = document.getElementById('supEditProdUnit').value.trim();
      const desc = document.getElementById('supEditProdDesc').value.trim();
      const image = document.getElementById('supEditProdImg').value.trim();

      if (supplierPrice <= 0 || stock < 0) {
        showToast('Harga dan stok harus angka positif yang valid.', 'warning');
        return;
      }

      prod.name = name;
      prod.category = category;
      prod.supplierPrice = supplierPrice;
      prod.normalPrice = normalPrice;
      prod.stock = stock;
      prod.unit = unit;
      prod.desc = desc;
      if (image) prod.image = image;

      State.saveProducts();
      closeModal();
      showToast(`Data produk "${name}" berhasil diperbarui!`, 'success');
      renderApp();
    }

    function confirmSupplierDeleteProduct(prodId) {

      }

    function handleSupplierDeleteProduct(prodId) {

        showToast('Akses ditolak!', 'danger');
        closeModal();
        return;
      }

    // --- FITUR PESANAN MASUK SUPPLIER ---
    function renderSupplierOrdersView(supplier, myOrders) {
      if (!myOrders) {
        myOrders = State.orders.filter(order => {
          if (order.supplierIds && order.supplierIds.includes(supplier.id)) return true;
          if (order.items && order.items.some(it => it.supplierId === supplier.id)) return true;
          return false;
        });
      }

      const pendingOrders = myOrders.filter(o => {
        const conf = o.supplierConfirmations && o.supplierConfirmations[supplier.id];
        const isPending = !conf || conf.status === 'Menunggu Konfirmasi';
        return isPending && o.status !== 'Ditolak' && o.status !== 'Dibatalkan';
      });

      const processingOrders = myOrders.filter(o => o.status === 'Pesanan Diterima' || o.status === 'Pesanan Dikonfirmasi Supplier' || o.status === 'Diproses' || o.status === 'Dikemas');
      const shippingOrders = myOrders.filter(o => o.status === 'Dikirim' || o.status === 'Dalam Pengiriman' || o.status === 'Diproses Admin untuk Pengiriman');
      const completedOrders = myOrders.filter(o => o.status === 'Pesanan Selesai' || o.status === 'Pesanan Diterima di Warung' || o.status === 'Pesanan Tiba');
      const rejectedOrders = myOrders.filter(o => {
        const conf = o.supplierConfirmations && o.supplierConfirmations[supplier.id];
        return o.status === 'Ditolak' || (conf && conf.status === 'Ditolak');
      });

      const currentFilter = State.supplierOrderFilter || 'all';
      let filtered = myOrders;
      if (currentFilter === 'pending') filtered = pendingOrders;
      else if (currentFilter === 'confirmed' || currentFilter === 'processing') filtered = processingOrders;
      else if (currentFilter === 'shipping') filtered = shippingOrders;
      else if (currentFilter === 'done') filtered = completedOrders;
      else if (currentFilter === 'rejected') filtered = rejectedOrders;

      return `
        <div>
          <!-- Header Bar -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h6 class="fw-bold text-dark mb-0">Pesanan Masuk Mitra Warung</h6>
              <small class="text-muted" style="font-size:0.72rem;">Proses, kemas, dan kirim pasokan sembako secara mandiri</small>
            </div>
            <span class="badge bg-pandai-primary text-white rounded-pill px-3 py-1">
              ${myOrders.length} Total Pesanan
            </span>
          </div>

          <!-- KPI Counters -->
          <div class="row g-2 mb-3 text-center">
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-warning border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Perlu Cek</small>
                <div class="fw-bold text-warning fs-6">${pendingOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-info border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Diproses/Kemas</small>
                <div class="fw-bold text-info fs-6">${processingOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-primary border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Dikirim</small>
                <div class="fw-bold text-primary fs-6">${shippingOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-success border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Selesai</small>
                <div class="fw-bold text-success fs-6">${completedOrders.length}</div>
              </div>
            </div>
          </div>

          <!-- Filter Navigation Chips -->
          <div class="category-scroll mb-3">
            <div class="category-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setSupplierOrderFilter('all')">
              Semua (${myOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'pending' ? 'active' : ''}" onclick="setSupplierOrderFilter('pending')">
              Perlu Konfirmasi (${pendingOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'processing' || currentFilter === 'confirmed' ? 'active' : ''}" onclick="setSupplierOrderFilter('processing')">
              Diproses & Dikemas (${processingOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'shipping' ? 'active' : ''}" onclick="setSupplierOrderFilter('shipping')">
              Dalam Pengiriman (${shippingOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'done' ? 'active' : ''}" onclick="setSupplierOrderFilter('done')">
              Selesai (${completedOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'rejected' ? 'active' : ''}" onclick="setSupplierOrderFilter('rejected')">
              Ditolak (${rejectedOrders.length})
            </div>
          </div>

          <!-- Daftar Pesanan -->
          ${filtered.length === 0 ? `
            <div class="pandai-card text-center py-5">
              <i class="bi bi-inbox text-muted" style="font-size: 2.5rem;"></i>
              <h6 class="fw-bold mt-2 text-dark">Tidak Ada Pesanan</h6>
              <p class="text-muted small mb-0">Belum ada pesanan yang sesuai dengan filter ini.</p>
            </div>
          ` : `
            <div class="d-grid gap-3">
              ${filtered.map(order => {
                const myItems = order.items.filter(it => it.supplierId === supplier.id);
                const mySubtotal = myItems.reduce((sum, it) => sum + (it.subtotal || it.price * it.qty), 0);
                const conf = (order.supplierConfirmations && order.supplierConfirmations[supplier.id]) || { status: 'Menunggu Konfirmasi' };
                const isPending = (conf.status === 'Menunggu Konfirmasi' || order.status === 'Menunggu Konfirmasi Supplier') && order.status !== 'Ditolak' && order.status !== 'Dibatalkan';

                return `
                  <div class="pandai-card p-3 mb-0 shadow-sm border ${isPending ? 'border-warning' : 'border-light'}">
                    <!-- Card Header -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <div>
                        <div class="d-flex align-items-center gap-2">
                          <span class="fw-bold text-dark fs-6">#${order.id}</span>
                          <span class="badge bg-light text-dark border" style="font-size:0.68rem;">
                            <i class="bi bi-clock me-1"></i>${order.date}
                          </span>
                        </div>
                      </div>
                      <div>
                        ${getOrderStatusBadge(order.status)}
                      </div>
                    </div>

                    <!-- Pembeli & Tujuan Pengiriman -->
                    <div class="p-2 rounded bg-light mb-2" style="font-size:0.75rem;">
                      <div class="row g-1">
                        <div class="col-7">
                          <span class="text-muted"><i class="bi bi-shop me-1 text-primary"></i>Mitra Warung:</span>
                          <div class="fw-bold text-dark text-truncate">${order.buyerName || 'Mitra Warung'}</div>
                          <div class="text-muted" style="font-size:0.7rem;">${order.businessName || 'Warung Kelontong'}</div>
                        </div>
                        <div class="col-5 text-end">
                          <span class="text-muted"><i class="bi bi-telephone me-1"></i>No. HP:</span>
                          <div class="fw-semibold text-dark">${order.buyerPhone || '-'}</div>
                        </div>
                        <div class="col-12 mt-1 pt-1 border-top">
                          <span class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i>Alamat Pengiriman:</span>
                          <div class="text-dark fw-medium">${order.shippingAddress || '-'}</div>
                        </div>
                        <div class="col-12 mt-1">
                          <span class="text-muted"><i class="bi bi-wallet2 me-1 text-success"></i>Pembayaran:</span>
                          <span class="fw-semibold text-dark ms-1">${order.paymentMethod}</span>
                        </div>
                        <div class="col-12 mt-1">
                          <span class="text-muted"><i class="bi bi-truck me-1 text-info"></i>Metode Pengiriman:</span>

                        </div>
                        ${order.shippingNotes ? `
                          <div class="col-12 mt-1 text-primary fst-italic" style="font-size:0.7rem;">
                            <i class="bi bi-chat-left-dots me-1"></i>Catatan: "${order.shippingNotes}"
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <!-- Daftar Produk Milik Supplier Ini -->
                    <div class="border rounded p-2 mb-2 bg-white" style="font-size:0.75rem;">
                      <div class="fw-bold text-dark mb-1 d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-boxes me-1 text-success"></i>Item Pasokan Anda (${myItems.length}):</span>
                        <span class="text-success fw-bold">${formatRupiah(mySubtotal)}</span>
                      </div>
                      <div class="d-grid gap-1">
                        ${myItems.map(it => `
                          <div class="d-flex justify-content-between align-items-center py-1 border-bottom-dashed">
                            <div>
                              <div class="fw-semibold text-dark">${it.name}</div>
                              <small class="text-muted">${it.qty} ${it.unit || ''} x ${formatRupiah(it.price)}</small>
                            </div>
                            <strong class="text-dark">${formatRupiah(it.subtotal || it.price * it.qty)}</strong>
                          </div>
                        `).join('')}
                      </div>
                    </div>

                    <!-- Status Konfirmasi Anda -->
                    <div class="mb-2">
                      ${isPending ? `
                        <div class="p-2 rounded bg-warning-subtle text-warning-emphasis border border-warning small d-flex align-items-center gap-2">
                          <i class="bi bi-exclamation-triangle-fill fs-5 text-warning flex-shrink-0"></i>
                          <div>
                            <div class="fw-bold" style="font-size:0.75rem;">Periksa Ketersediaan Stok</div>
                            <div style="font-size:0.7rem;">Terima pesanan untuk otomatis memotong stok dari etalase Anda, atau tolak dengan alasan jelas.</div>
                          </div>
                        </div>
                      ` : (conf.status === 'Dikonfirmasi' || order.status === 'Pesanan Diterima') ? `
                        <div class="p-2 rounded bg-success-subtle text-success border border-success small d-flex align-items-center gap-2">
                          <i class="bi bi-check-circle-fill fs-5 flex-shrink-0"></i>
                          <div>
                            <div class="fw-bold" style="font-size:0.75rem;">Telah Anda Terima (Stok Terpotong)</div>

                          </div>
                        </div>
                      ` : conf.status === 'Ditolak' ? `
                        <div class="p-2 rounded bg-danger-subtle text-danger border border-danger small d-flex align-items-center gap-2">
                          <i class="bi bi-x-circle-fill fs-5 flex-shrink-0"></i>
                          <div>
                            <div class="fw-bold" style="font-size:0.75rem;">Ditolak oleh Anda</div>

                    <!-- Tombol Aksi Mandiri Supplier (Alur Berurutan Tanpa Persetujuan Admin) -->

                      ${isPending ? `
                        <div class="d-flex gap-2">
                          <button class="btn btn-sm btn-outline-danger flex-fill rounded-pill py-2 fw-semibold" onclick="openSupplierRejectOrderModal('${order.id}')">
                            <i class="bi bi-x-circle me-1"></i> Tolak Pesanan

    // Aksi 1: Supplier Menerima Pesanan & Memotong Stok Nyata
    function handleSupplierAcceptOrder(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'supplier') {
        showToast('Akses ditolak: Hanya akun Supplier yang dapat menerima pesanan!', 'danger');
        return;
      }
      const supplier = State.currentUser;
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }
      if (order.status === 'Ditolak' || order.status === 'Dibatalkan') {
        showToast('Pesanan ini sudah ditolak atau dibatalkan.', 'warning');
        return;
      }

      const myItems = order.items.filter(it => it.supplierId === supplier.id);
      if (myItems.length === 0) {
        showToast('Pesanan ini tidak memuat produk dari etalase Anda.', 'danger');
        return;
      }

      // Validasi Ketersediaan Stok Nyata di Database
      for (const item of myItems) {
        const prod = State.products.find(p => p.id === item.productId);
        const currentStock = prod ? (Number(prod.stock) || 0) : 0;
        const requiredQty = Number(item.qty) || 0;
        if (currentStock < requiredQty) {
          showToast(`Stok tidak mencukupi untuk "${item.name}"! Sisa stok Anda: ${currentStock}, dipesan: ${requiredQty}. Harap tambah stok terlebih dahulu.`, 'danger');
          return;
        }
      }

      // Potong Stok Nyata dari Database
      for (const item of myItems) {
        const prod = State.products.find(p => p.id === item.productId);
        if (prod) {
          prod.stock = Math.max(0, (Number(prod.stock) || 0) - (Number(item.qty) || 0));
        }
        item.status = 'Dikonfirmasi';
      }
      State.saveProducts();

      // Catat Penerimaan Supplier
      const nowStr = getNowFormattedString();
      if (!order.supplierConfirmations) {
        order.supplierConfirmations = {};
      }
      order.supplierConfirmations[supplier.id] = {
        status: 'Dikonfirmasi',
        confirmedAt: nowStr,
        rejectedAt: null,
        rejectionReason: ''
      };

      const allSuppliers = order.supplierIds && order.supplierIds.length > 0 ? order.supplierIds : [supplier.id];
      const allConfirmed = allSuppliers.every(sId => {
        const conf = order.supplierConfirmations[sId];
        return conf && conf.status === 'Dikonfirmasi';
      });

      if (allConfirmed) {
        order.status = 'Pesanan Diterima';
        if (!order.trackingSteps || order.trackingSteps.length !== 7) {
          order.trackingSteps = createCanonicalTrackingSteps(order.date);
        }
        order.trackingSteps[1].done = true;
        order.trackingSteps[1].active = false;
        order.trackingSteps[2].done = true;
        order.trackingSteps[2].active = true;
        order.trackingSteps[2].time = nowStr;
      }

      order.lastUpdated = nowStr;
      State.saveOrders();
      closeModal();
      showToast(`Pesanan #${order.id} berhasil diterima! Stok produk telah dikurangi otomatis dari etalase Anda.`, 'success');
      renderApp();
    }

    // Alias kompatibilitas
    function handleSupplierConfirmOrder(orderId) {
      return handleSupplierAcceptOrder(orderId);
    }

    // Aksi 2: Supplier Memperbarui Status Pesanan Secara Berurutan (Diproses, Dikemas, Selesai)
    function handleSupplierUpdateStatus(orderId, newStatus) {
      if (!State.currentUser || State.currentUser.role !== 'supplier') {
        showToast('Akses ditolak: Hanya Supplier yang dapat memperbarui status pesanan ini!', 'danger');
        return;
      }
      const supplier = State.currentUser;
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }
      const hasMyProduct = order.items && order.items.some(it => it.supplierId === supplier.id);
      if (!hasMyProduct && (!order.supplierIds || !order.supplierIds.includes(supplier.id))) {
        showToast('Akses ditolak: Anda bukan pemilik produk dalam pesanan ini.', 'danger');
        return;
      }

      const nowStr = getNowFormattedString();
      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }

      if (newStatus === 'Diproses') {
        order.status = 'Diproses';
        order.trackingSteps[2].done = true;
        order.trackingSteps[2].active = false;
        order.trackingSteps[3].done = false;
        order.trackingSteps[3].active = true;
        order.trackingSteps[3].time = nowStr;
        order.lastUpdated = nowStr;
        State.saveOrders();
        showToast(`Pesanan #${order.id} mulai diproses dan disiapkan di gudang.`, 'success');
      } else if (newStatus === 'Dikemas') {
        order.status = 'Dikemas';
        order.trackingSteps[3].done = true;
        order.trackingSteps[3].active = false;
        order.trackingSteps[4].done = false;
        order.trackingSteps[4].active = true;
        order.lastUpdated = nowStr;
        State.saveOrders();
        showToast(`Pesanan #${order.id} selesai dikemas dan siap dikirim!`, 'success');
      } else if (newStatus === 'Pesanan Selesai') {
        order.status = 'Pesanan Selesai';
        order.trackingSteps[4].done = true;
        order.trackingSteps[4].active = false;
        order.trackingSteps[5].done = true;
        order.trackingSteps[5].active = false;
        if (!order.trackingSteps[5].time) order.trackingSteps[5].time = nowStr;
        order.trackingSteps[6].done = true;
        order.trackingSteps[6].active = false;
        order.trackingSteps[6].time = nowStr;
        order.lastUpdated = nowStr;
        State.saveOrders();
        showToast(`Pesanan #${order.id} telah ditandai Selesai. Transaksi tuntas!`, 'success');
      }
      closeModal();
      renderApp();
    }

    function handleSupplierRejectOrderSubmit(e, orderId) {
      if (e && e.preventDefault) e.preventDefault();
      if (!State.currentUser || State.currentUser.role !== 'supplier') {
        showToast('Akses ditolak: Hanya akun Supplier yang dapat menolak pesanan!', 'danger');
        return;
      }
      const supplier = State.currentUser;
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      const selectVal = document.getElementById('rejectReasonSelect') ? document.getElementById('rejectReasonSelect').value : '';
      const customVal = document.getElementById('rejectReasonCustom') ? document.getElementById('rejectReasonCustom').value.trim() : '';
      const reason = (selectVal === 'Lainnya' ? customVal : selectVal) || 'Stok tidak tersedia';

      const nowStr = getNowFormattedString();

      if (!order.supplierConfirmations) order.supplierConfirmations = {};
      order.supplierConfirmations[supplier.id] = {
        status: 'Ditolak',
        confirmedAt: null,
        rejectedAt: nowStr,
        rejectionReason: reason
      };

      order.status = 'Ditolak';
      order.rejectionReason = reason;
      order.lastUpdated = nowStr;

      // Kembalikan Limit Plafon jika menggunakan BNPL
      if (order.paymentMethod && order.paymentMethod.includes('BNPL')) {
        const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
        const uIdx = users.findIndex(u => u.id === order.userId);
        if (uIdx !== -1) {
          users[uIdx].remainingLimit = (Number(users[uIdx].remainingLimit) || 0) + (Number(order.total) || 0);
          localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
          if (State.currentUser && State.currentUser.id === order.userId) {
            State.currentUser.remainingLimit = users[uIdx].remainingLimit;
            State.saveUser();
          }
        }
        const inst = State.installments.find(i => i.orderId === order.id);
        if (inst) {
          inst.status = 'Dibatalkan';
          State.saveInstallments();
        }
      }

      State.saveOrders();
      closeModal();
      showToast(`Pesanan #${order.id} telah ditolak dengan alasan: "${reason}". Limit pembeli dikembalikan jika menggunakan BNPL.`, 'info');
      renderApp();
    }

                      <div class="fw-semibold text-dark">${it.name}</div>
                      <small class="text-muted">${it.qty} ${it.unit || ''} x ${formatRupiah(it.price)}</small>

                    <strong class="text-success">${formatRupiah(it.subtotal || it.price * it.qty)}</strong>
                  </div>
                `).join('')}
              </div>
              <div class="d-flex justify-content-between pt-1 border-top fw-bold">
                <span>Subtotal Produk Anda:</span>
                <span class="text-success">${formatRupiah(mySubtotal)}</span>
              </div>
            </div>

            <!-- 7 Tahapan Pelacakan Operasional -->
            <div class="p-2 border rounded bg-white mb-3" style="font-size:0.72rem;">
              <div class="fw-bold text-dark mb-2"><i class="bi bi-list-check me-1 text-primary"></i>Status Alur Operasional (7 Tahap):</div>
              <div class="d-grid gap-2">
                ${steps.map(s => `
                  <div class="d-flex align-items-start gap-2">
                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white" style="width:20px; height:20px; font-size:0.65rem; flex-shrink:0; background: ${s.done ? '#198754' : s.active ? '#0d6efd' : '#cbd5e1'};">
                      ${s.done ? '<i class="bi bi-check"></i>' : s.step}
                    </div>
                    <div class="flex-grow-1">
                      <div class="fw-semibold ${s.done ? 'text-success' : s.active ? 'text-primary' : 'text-muted'}">${s.title}</div>
                      ${s.time ? `<div class="text-muted" style="font-size:0.65rem;">${s.time}</div>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${isPending ? `
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-danger flex-fill rounded-pill py-2" onclick="closeModal(); openSupplierRejectOrderModal('${order.id}')">
                  <i class="bi bi-x-circle me-1"></i> Tolak Pesanan
                </button>
                <button class="btn btn-sm btn-pandai-primary text-white flex-fill rounded-pill py-2 fw-semibold" onclick="handleSupplierAcceptOrder('${order.id}')">
                  <i class="bi bi-check2-circle me-1"></i> Terima Pesanan
                </button>
              </div>
            ` : (order.status === 'Pesanan Diterima' || order.status === 'Pesanan Dikonfirmasi Supplier') ? `
              <button class="btn btn-sm btn-primary text-white w-100 rounded-pill py-2 fw-semibold" onclick="closeModal(); handleSupplierUpdateStatus('${order.id}', 'Diproses')">
                <i class="bi bi-gear-fill me-1"></i> Mulai Proses Pesanan
              </button>
            ` : order.status === 'Diproses' ? `
              <button class="btn btn-sm btn-warning text-dark w-100 rounded-pill py-2 fw-semibold" onclick="closeModal(); handleSupplierUpdateStatus('${order.id}', 'Dikemas')">
                <i class="bi bi-box-seam me-1"></i> Selesai Kemas (Siap Kirim)
              </button>
            ` : order.status === 'Dikemas' ? `
              <button class="btn btn-sm btn-success text-white w-100 rounded-pill py-2 fw-semibold" onclick="closeModal(); openSupplierDispatchModal('${order.id}')">
                <i class="bi bi-truck me-1"></i> Kirim Barang & Input Resi
              </button>
            ` : (order.status === 'Dikirim' || order.status === 'Dalam Pengiriman') ? `
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary flex-fill rounded-pill py-2" onclick="closeModal(); openSupplierDispatchModal('${order.id}')">
                  <i class="bi bi-pencil me-1"></i> Ubah Data Kirim / Resi

                  <i class="bi bi-check-all me-1"></i> Tandai Selesai

            ` : `
              <button class="btn btn-sm btn-secondary w-100 rounded-pill py-2" onclick="closeModal()">Tutup</button>
            `}
          </div>
        </div>
      `);

    function renderAdminOrdersTab() {
      const orders = State.orders || [];
      const pendingSupplierOrders = orders.filter(o => o.status === 'Menunggu Konfirmasi Supplier');
      const processingOrders = orders.filter(o => 
        o.status === 'Pesanan Diterima' || 
        o.status === 'Pesanan Dikonfirmasi Supplier' || 
        o.status === 'Diproses' || 
        o.status === 'Dikemas'
      );
      const shippingOrders = orders.filter(o => 
        o.status === 'Dikirim' || 
        o.status === 'Dalam Pengiriman' || 
        o.status === 'Diproses Admin untuk Pengiriman'
      );
      const completedOrders = orders.filter(o => 
        o.status === 'Pesanan Selesai' || 
        o.status === 'Pesanan Diterima di Warung' ||
        o.status === 'Pesanan Tiba'
      );
      const rejectedOrders = orders.filter(o => 
        o.status === 'Ditolak' || 
        o.status === 'Ditolak Supplier' || 
        o.status === 'Dibatalkan'
      );

      const currentFilter = State.adminOrderFilter || 'all';
      let filtered = orders;
      if (currentFilter === 'pending_supplier' || currentFilter === 'pending') filtered = pendingSupplierOrders;
      else if (currentFilter === 'processing' || currentFilter === 'ready_to_ship') filtered = processingOrders;
      else if (currentFilter === 'in_delivery' || currentFilter === 'shipping') filtered = shippingOrders;
      else if (currentFilter === 'completed') filtered = completedOrders;
      else if (currentFilter === 'rejected') filtered = rejectedOrders;

      return `
        <div>
          <!-- Header Bar -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-graph-up-arrow text-success me-1"></i> Dashboard Pemantauan Transaksi & Logistik</h6>
              <small class="text-muted" style="font-size:0.72rem;">Monitoring real-time transaksi seluruh Supplier & Mitra Warung UMKM</small>
            </div>
            <span class="badge bg-pandai-primary text-white rounded-pill px-3 py-1">
              ${orders.length} Transaksi
            </span>
          </div>

          <!-- Alert Info Otoritas Koperasi -->
          <div class="p-2 rounded bg-light border-start border-success border-3 mb-3 text-start" style="font-size:0.74rem;">
            <div class="fw-semibold text-dark"><i class="bi bi-shield-check text-success me-1"></i>Pemantauan Transparan Tanpa Bottleneck Persetujuan:</div>
            <div class="text-muted">Supplier berwenang penuh memproses, mengemas, dan memberangkatkan armada secara mandiri. Admin Koperasi memantau seluruh transaksi, kesiapan pasokan, dan pemenuhan pesanan secara objektif dan akurat.</div>
          </div>

          <!-- KPI Metric Counters -->
          <div class="row g-2 mb-3 text-center">
            <div class="col-4">
              <div class="pandai-card p-2 mb-0 border-start border-warning border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Menunggu Supplier</small>
                <div class="fw-bold text-warning fs-6">${pendingSupplierOrders.length}</div>
              </div>
            </div>
            <div class="col-4">
              <div class="pandai-card p-2 mb-0 border-start border-info border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Diproses & Dikemas</small>
                <div class="fw-bold text-info fs-6">${processingOrders.length}</div>
              </div>
            </div>
            <div class="col-4">
              <div class="pandai-card p-2 mb-0 border-start border-primary border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Dalam Pengiriman</small>
                <div class="fw-bold text-primary fs-6">${shippingOrders.length}</div>
              </div>
            </div>
          </div>

          <!-- Filter Navigation Chips -->
          <div class="category-scroll mb-3">
            <div class="category-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setAdminOrderFilter('all')">
              Semua (${orders.length})
            </div>
            <div class="category-chip ${currentFilter === 'pending_supplier' || currentFilter === 'pending' ? 'active' : ''}" onclick="setAdminOrderFilter('pending_supplier')">
              Menunggu Supplier (${pendingSupplierOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'processing' || currentFilter === 'ready_to_ship' ? 'active' : ''}" onclick="setAdminOrderFilter('processing')">
              Diproses & Dikemas (${processingOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'in_delivery' || currentFilter === 'shipping' ? 'active' : ''}" onclick="setAdminOrderFilter('in_delivery')">
              Dalam Kirim (${shippingOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'completed' ? 'active' : ''}" onclick="setAdminOrderFilter('completed')">
              Selesai (${completedOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'rejected' ? 'active' : ''}" onclick="setAdminOrderFilter('rejected')">
              Ditolak (${rejectedOrders.length})
            </div>
          </div>

          <!-- Orders List -->
          ${filtered.length === 0 ? `
            <div class="pandai-card text-center py-5">
              <i class="bi bi-inbox text-muted" style="font-size: 2.5rem;"></i>
              <h6 class="fw-bold mt-2 text-dark">Tidak Ada Transaksi</h6>
              <p class="text-muted small mb-0">Belum ada pesanan yang sesuai kategori pemantauan ini.</p>
            </div>
          ` : `
            <div class="d-grid gap-3">
              ${filtered.map(order => {
                const uniqueSuppliers = order.supplierIds || [...new Set((order.items || []).map(i => i.supplierId))];
                const supplierNamesList = [...new Set((order.items || []).map(i => i.supplierName || 'PT Pangan Nusantara Grosir'))].join(', ') || 'Supplier Terdaftar';
                const allSuppliersConfirmed = uniqueSuppliers.every(sId => {
                  const conf = order.supplierConfirmations && order.supplierConfirmations[sId];
                  return conf && conf.status === 'Dikonfirmasi';
                });

                return `
                  <div class="pandai-card p-3 mb-0 shadow-sm border text-start">
                    <!-- Header Kartu: No. Pesanan, Tanggal/Jam, Status -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <div>
                        <div class="d-flex align-items-center gap-2">
                          <span class="fw-bold text-dark fs-6">#${order.id}</span>
                          <span class="badge bg-light text-dark border" style="font-size:0.68rem;">
                            <i class="bi bi-clock me-1"></i>${order.date}
                          </span>
                        </div>
                        <div class="text-dark small mt-1">
                          <i class="bi bi-shop text-primary me-1"></i>Mitra UMKM: <strong>${order.buyerName || 'Mitra Warung'}</strong> (${order.businessName || 'Warung Binaan'})
                        </div>
                      </div>
                      <div>
                        ${getOrderStatusBadge(order.status)}
                      </div>
                    </div>

                    <!-- Informasi Transaksi, Nilai, Pembayaran, Kontak -->
                    <div class="p-2 rounded bg-light mb-2" style="font-size:0.75rem;">
                      <div class="row g-1">
                        <div class="col-7">
                          <span class="text-muted"><i class="bi bi-wallet2 me-1 text-success"></i>Nilai Transaksi:</span>
                          <div class="fw-bold text-success fs-6">${formatRupiah(order.total)}</div>
                          <div class="text-muted" style="font-size:0.7rem;">Metode: <strong>${order.paymentMethod}</strong></div>
                          <div class="mt-1">${getPaymentStatusBadge(order.paymentStatus || 'Menunggu Pembayaran')}</div>
                        </div>
                        <div class="col-5 text-end">
                          <span class="text-muted"><i class="bi bi-telephone me-1"></i>Kontak Pembeli:</span>
                          <div class="fw-semibold text-dark">${order.buyerPhone || '-'}</div>
                          <div class="text-muted" style="font-size:0.68rem;">Total: ${(order.items || []).length} item</div>
                        </div>
                        <div class="col-12 mt-1 pt-1 border-top">
                          <span class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i>Alamat Kirim:</span>
                          <div class="text-dark">${order.shippingAddress || '-'}</div>
                        </div>
                        ${order.shippingNotes ? `
                          <div class="col-12 text-primary fst-italic" style="font-size:0.7rem;">
                            <i class="bi bi-chat-left-dots me-1"></i>Catatan Pembeli: "${order.shippingNotes}"
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <!-- Informasi Rekanan Supplier Pengirim & Kesiapan Pasokan -->
                    <div class="p-2 border rounded bg-white mb-2" style="font-size:0.72rem;">
                      <div class="fw-bold text-dark mb-1 d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-building text-success me-1"></i>Pemasok Pengirim (Supplier):</span>
                        <span class="badge ${allSuppliersConfirmed ? 'bg-success' : 'bg-warning text-dark'}">
                          ${allSuppliersConfirmed ? 'Semua Stok Siap' : 'Menunggu Konfirmasi'}
                        </span>
                      </div>
                      <div class="text-dark fw-medium mb-1">
                        <i class="bi bi-truck me-1 text-muted"></i>${supplierNamesList}
                      </div>
                      <div class="d-grid gap-1">
                        ${uniqueSuppliers.map(sId => {
                          const conf = order.supplierConfirmations && order.supplierConfirmations[sId];
                          const supProd = (order.items || []).find(i => i.supplierId === sId);
                          const supName = supProd ? supProd.supplierName : 'PT Pangan Nusantara Grosir';
                          const statusText = conf ? conf.status : (order.status === 'Pesanan Dikonfirmasi Supplier' || order.status === 'Pesanan Diterima' ? 'Dikonfirmasi' : 'Menunggu Konfirmasi');
                          const isOk = statusText === 'Dikonfirmasi';
                          const isRej = statusText === 'Ditolak';
                          return `
                            <div class="d-flex justify-content-between align-items-center py-1 border-bottom-dashed">
                              <span class="text-secondary" style="font-size:0.7rem;">${supName}</span>
                              <span class="badge ${isOk ? 'bg-success-subtle text-success border border-success' : isRej ? 'bg-danger-subtle text-danger border border-danger' : 'bg-warning-subtle text-warning-emphasis border border-warning'} px-2 py-0">
                                ${statusText} ${conf && conf.confirmedAt ? `(${conf.confirmedAt})` : ''}
                              </span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>

                    <!-- Informasi Logistik Pengiriman Mandiri oleh Supplier -->
                    <div class="p-2 border rounded bg-white mb-2" style="font-size:0.72rem;">
                      <div class="fw-bold text-dark mb-1 d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-send-check text-info me-1"></i>Data Logistik Pengiriman:</span>
                        ${order.trackingNumber ? `<span class="badge bg-primary text-white">Resi: ${order.trackingNumber}</span>` : '<span class="badge bg-light text-muted border">Belum Ada Resi</span>'}
                      </div>
                      <div class="row g-1">
                        <div class="col-6">
                          <span class="text-muted">Metode Pengiriman:</span>
                          <div class="fw-semibold text-dark">${order.deliveryMethod || 'Ditangani mandiri oleh Supplier'}</div>
                        </div>
                        <div class="col-6">
                          <span class="text-muted">Jadwal / Waktu Berangkat:</span>
                          <div class="fw-semibold text-dark">${order.deliverySchedule || '-'}</div>
                        </div>
                        <div class="col-6 mt-1">
                          <span class="text-muted">Driver / Kurir:</span>
                          <div class="fw-semibold text-dark">${order.courierName || '<span class="text-muted fst-italic">Belum diinput Supplier</span>'}</div>
                        </div>
                        <div class="col-6 mt-1">
                          <span class="text-muted">No. Kontak Kurir:</span>
                          <div class="fw-semibold text-dark">${order.courierPhone || '-'}</div>
                        </div>
                        ${order.deliveryNotes ? `
                          <div class="col-12 mt-1 pt-1 border-top text-muted">
                            Catatan Logistik: ${order.deliveryNotes}
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <!-- Waktu Pembaruan Terakhir -->
                    <div class="text-muted small mb-2 d-flex align-items-center gap-1" style="font-size:0.7rem;">
                      <i class="bi bi-arrow-repeat text-primary"></i>
                      <span>Pembaruan Terakhir: <strong class="text-dark">${order.lastUpdated || order.date}</strong></span>
                    </div>

                    <!-- Tombol Aksi Pemantauan Admin (Tanpa Tombol Persetujuan / Override) -->
                    <div class="d-flex gap-2 pt-2 border-top flex-wrap">
                      <button class="btn btn-sm btn-outline-primary flex-fill rounded-pill py-2 fw-semibold" onclick="openAdminOrderDetailModal('${order.id}')">
                        <i class="bi bi-journal-text me-1"></i> Detail Pesanan
                      </button>
                      ${order.paymentProof ? `
                        <button class="btn btn-sm btn-outline-success flex-fill rounded-pill py-2 fw-semibold" onclick="openViewPaymentProofModal('${order.id}')">
                          <i class="bi bi-receipt me-1"></i> Bukti Bayar
                        </button>
                      ` : ''}
                      <button class="btn btn-sm btn-light border flex-fill rounded-pill py-2 text-muted fw-semibold" style="font-size:0.75rem;" onclick="openOrderTrackingModal('${order.id}')">
                        <i class="bi bi-geo-alt me-1"></i> Pantau 7 Tahapan
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function setAdminPaymentFilter(filter) {
      if (!State.currentUser || State.currentUser.role !== 'admin') return;
      State.adminPaymentFilter = filter;
      renderApp();
    }

    function renderAdminPaymentsTab() {
      const orders = State.orders || [];
      const cfg = State.paymentConfig || getPaymentConfig();
      const currentFilter = State.adminPaymentFilter || 'all';

      const pendingVerificationOrders = orders.filter(o => o.paymentStatus === 'Menunggu Verifikasi');
      const verifiedOrders = orders.filter(o => o.paymentStatus === 'Terverifikasi' || o.paymentStatus === 'Terverifikasi (BNPL Koperasi)');
      const rejectedOrders = orders.filter(o => o.paymentStatus === 'Ditolak');
      const unpaidOrders = orders.filter(o => !o.paymentStatus || o.paymentStatus === 'Menunggu Pembayaran');

      let filtered = orders;
      if (currentFilter === 'pending_verification') filtered = pendingVerificationOrders;
      else if (currentFilter === 'verified') filtered = verifiedOrders;
      else if (currentFilter === 'rejected') filtered = rejectedOrders;
      else if (currentFilter === 'unpaid') filtered = unpaidOrders;

      return `
        <div>
          <!-- Header Bar -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-wallet2 text-success me-1"></i> Verifikasi Pembayaran & Saluran Resmi</h6>
              <small class="text-muted" style="font-size:0.72rem;">Validasi bukti transfer pelanggan dan kelola rekening resmi koperasi</small>
            </div>
            <span class="badge bg-pandai-primary text-white rounded-pill px-3 py-1">
              ${orders.length} Transaksi
            </span>
          </div>

          <!-- Alert Otoritas Verifikasi Admin -->
          <div class="p-2 rounded bg-light border-start border-success border-3 mb-3 text-start" style="font-size:0.74rem;">
            <div class="fw-semibold text-dark"><i class="bi bi-shield-check text-success me-1"></i>Kewenangan Verifikasi Keuangan Admin Koperasi:</div>
            <div class="text-muted">Admin koperasi berwenang memverifikasi validitas dana yang masuk melalui QRIS dan Transfer Rekening BRI. Verifikasi pembayaran dicatat secara administratif tanpa mengintervensi atau mengubah alur kerja logistik pengiriman mandiri oleh Supplier.</div>
          </div>

          <!-- KPI Counters -->
          <div class="row g-2 mb-3 text-center">
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-warning border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Perlu Cek</small>
                <div class="fw-bold text-warning fs-6">${pendingVerificationOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-success border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Terverifikasi</small>
                <div class="fw-bold text-success fs-6">${verifiedOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-danger border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Ditolak</small>
                <div class="fw-bold text-danger fs-6">${rejectedOrders.length}</div>
              </div>
            </div>
            <div class="col-3">
              <div class="pandai-card p-2 mb-0 border-start border-secondary border-3 shadow-none">
                <small class="text-muted d-block text-truncate" style="font-size:0.68rem;">Menunggu Bayar</small>
                <div class="fw-bold text-secondary fs-6">${unpaidOrders.length}</div>
              </div>
            </div>
          </div>

          <!-- Filter Navigation Chips -->
          <div class="category-scroll mb-3">
            <div class="category-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setAdminPaymentFilter('all')">
              Semua (${orders.length})
            </div>
            <div class="category-chip ${currentFilter === 'pending_verification' ? 'active' : ''}" onclick="setAdminPaymentFilter('pending_verification')">
              Menunggu Verifikasi (${pendingVerificationOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'verified' ? 'active' : ''}" onclick="setAdminPaymentFilter('verified')">
              Terverifikasi (${verifiedOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'rejected' ? 'active' : ''}" onclick="setAdminPaymentFilter('rejected')">
              Ditolak (${rejectedOrders.length})
            </div>
            <div class="category-chip ${currentFilter === 'unpaid' ? 'active' : ''}" onclick="setAdminPaymentFilter('unpaid')">
              Menunggu Bayar (${unpaidOrders.length})
            </div>
          </div>

          <!-- Daftar Pesanan Pembayaran -->
          <div class="mb-4">
            ${filtered.length === 0 ? `
              <div class="pandai-card text-center py-5">
                <i class="bi bi-wallet-fill text-muted" style="font-size: 2.5rem;"></i>
                <h6 class="fw-bold mt-2 text-dark">Tidak Ada Transaksi Pembayaran</h6>
                <p class="text-muted small mb-0">Belum ada pesanan dalam kategori status pembayaran ini.</p>
              </div>
            ` : `
              <div class="d-grid gap-3">
                ${filtered.map(order => {
                  const proof = order.paymentProof;
                  const isPending = order.paymentStatus === 'Menunggu Verifikasi';
                  const isVerified = order.paymentStatus === 'Terverifikasi' || order.paymentStatus === 'Terverifikasi (BNPL Koperasi)';
                  const isRejected = order.paymentStatus === 'Ditolak';

                  return `
                    <div class="pandai-card p-3 mb-0 shadow-sm border text-start">
                      <!-- Header: Order ID & Status -->
                      <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                          <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold text-dark fs-6">#${order.id}</span>
                            <span class="badge bg-light text-dark border" style="font-size:0.68rem;">
                              <i class="bi bi-clock me-1"></i>${order.date}
                            </span>
                          </div>
                          <div class="text-dark small mt-1">
                            <i class="bi bi-shop text-primary me-1"></i>Mitra UMKM: <strong>${order.buyerName || 'Mitra Warung'}</strong> (${order.businessName || 'Warung'})
                          </div>
                        </div>
                        <div>
                          ${getPaymentStatusBadge(order.paymentStatus || 'Menunggu Pembayaran')}
                        </div>
                      </div>

                      <!-- Detail Finansial & Metode -->
                      <div class="p-2 rounded bg-light mb-2" style="font-size:0.75rem;">
                        <div class="row g-1">
                          <div class="col-7">
                            <span class="text-muted">Total Tagihan:</span>
                            <div class="fw-bold text-success fs-6">${formatRupiah(order.total)}</div>
                            <div class="text-muted" style="font-size:0.7rem;">Metode: <strong>${order.paymentMethod}</strong></div>
                          </div>
                          <div class="col-5 text-end">
                            <span class="text-muted">Kontak Pembeli:</span>
                            <div class="fw-semibold text-dark">${order.buyerPhone || '-'}</div>
                            <div class="text-muted" style="font-size:0.68rem;">${(order.items || []).length} macam sembako</div>
                          </div>
                        </div>
                      </div>

                      <!-- Informasi Bukti Pembayaran -->
                      <div class="p-2 border rounded bg-white mb-2" style="font-size:0.72rem;">
                        <div class="fw-bold text-dark mb-1 d-flex justify-content-between align-items-center">
                          <span><i class="bi bi-receipt text-success me-1"></i>Berkas Bukti Pembayaran:</span>
                          ${proof ? `<span class="badge bg-success-subtle text-success">Sudah Diunggah</span>` : `<span class="badge bg-secondary-subtle text-secondary">Belum Ada Bukti</span>`}
                        </div>
                        ${proof ? `
                          <div class="text-dark">
                            <strong>${proof.fileName}</strong> (${Math.round((proof.fileSize || 0)/1024)} KB)
                          </div>
                          <div class="text-muted mt-1">
                            Pengirim: <strong>${proof.senderBank || '-'}</strong> a.n. <strong>${proof.senderName || '-'}</strong> • Diunggah: ${proof.uploadedAt}
                          </div>
                          ${proof.notes ? `<div class="mt-1 text-primary fst-italic">Catatan Customer: "${proof.notes}"</div>` : ''}
                        ` : order.paymentStatus === 'Terverifikasi (BNPL Koperasi)' ? `
                          <div class="text-muted">Pembayaran dijamin oleh Plafon Fasilitas Koperasi PayLater. Limit telah didebit otomatis.</div>
                        ` : `
                          <div class="text-muted">Customer belum mengunggah struk/screenshot pembayaran melalui QRIS/Transfer Bank.</div>
                        `}
                      </div>

                      ${order.paymentRejectionReason ? `
                        <div class="alert alert-danger py-1 px-2 mb-2 small" style="font-size:0.72rem;">
                          <i class="bi bi-x-circle-fill me-1"></i><strong>Alasan Penolakan:</strong> ${order.paymentRejectionReason}
                        </div>
                      ` : ''}

                      <!-- Tombol Verifikasi & Detail -->
                      <div class="d-flex gap-2 pt-2 border-top flex-wrap">
                        ${proof ? `
                          <button class="btn btn-sm btn-outline-primary rounded-pill flex-fill py-1 fw-semibold" style="font-size:0.75rem;" onclick="openViewPaymentProofModal('${order.id}')">
                            <i class="bi bi-eye me-1"></i> Buka Bukti File
                          </button>
                        ` : ''}
                        ${isPending ? `
                          <button class="btn btn-sm btn-success rounded-pill flex-fill py-1 fw-semibold" style="font-size:0.75rem;" onclick="handleAdminVerifyPayment('${order.id}', true)">
                            <i class="bi bi-check2-circle me-1"></i> Setujui Pembayaran
                          </button>
                          <button class="btn btn-sm btn-outline-danger rounded-pill flex-fill py-1 fw-semibold" style="font-size:0.75rem;" onclick="openAdminRejectPaymentModal('${order.id}')">
                            <i class="bi bi-x-circle me-1"></i> Tolak
                          </button>
                        ` : isVerified ? `
                          <span class="badge bg-success-subtle text-success border border-success p-2 flex-fill text-center" style="font-size:0.72rem;">
                            <i class="bi bi-check2-all me-1"></i> Pembayaran Terverifikasi Sah
                          </span>
                        ` : ''}
                        <button class="btn btn-sm btn-light border rounded-pill flex-fill py-1 text-muted fw-semibold" style="font-size:0.75rem;" onclick="openAdminOrderDetailModal('${order.id}')">
                          <i class="bi bi-journal-text me-1"></i> Detail Pesanan
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <!-- FORM PENGATURAN SALURAN PEMBAYARAN RESMI KOPERASI -->
          <div class="pandai-card p-3 border shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-gear-wide-connected text-primary me-1"></i> Pengaturan Saluran Pembayaran Resmi Koperasi</h6>
              <span class="badge bg-primary text-white" style="font-size:0.68rem;">Konfigurasi Sistem</span>
            </div>
            <p class="text-muted small mb-3" style="font-size:0.72rem;">
              Perbarui informasi rekening transfer bank dan QRIS resmi Koperasi PANDAI secara langsung tanpa hardcode.
            </p>

            <form onsubmit="handleAdminSavePaymentConfig(event)">
              <div class="row g-2 mb-2">
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">Nama Bank Rekening Resmi</label>
                  <input type="text" id="cfgBankName" class="form-control form-control-sm" value="${cfg.bankName || 'Bank BRI'}" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">Nomor Rekening Bank</label>
                  <input type="text" id="cfgBankAccountNo" class="form-control form-control-sm" value="${cfg.bankAccountNo || '665501030233535'}" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">Atas Nama Pemilik Rekening</label>
                  <input type="text" id="cfgBankAccountHolder" class="form-control form-control-sm" value="${cfg.bankAccountHolder || 'IMELDA SINDI AYU SAPUTRI'}" required>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">Nama Merchant QRIS</label>
                  <input type="text" id="cfgQrisMerchantName" class="form-control form-control-sm" value="${cfg.qrisMerchantName || 'PANDAI'}" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">NMID QRIS</label>
                  <input type="text" id="cfgQrisNmid" class="form-control form-control-sm" value="${cfg.qrisNmid || 'ID1026622161325'}" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-semibold">Kode Terminal QRIS</label>
                  <input type="text" id="cfgQrisTerminalCode" class="form-control form-control-sm" value="${cfg.qrisTerminalCode || 'A01'}" required>
                </div>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-semibold">Path / URL Gambar QRIS Resmi</label>
                <input type="text" id="cfgQrisImagePath" class="form-control form-control-sm" value="${cfg.qrisImagePath || 'qris-pandai.jpg'}" required>

                  <span class="badge bg-info text-dark px-2 py-1">${s.accountStatus || 'Terverifikasi Koperasi'}</span>

                <div class="p-2 rounded bg-light mb-2" style="font-size:0.74rem;">
                  <div class="row g-1">
                    <div class="col-6">

                    <div class="col-6">

                    <strong class="${s.lastLoginAt ? 'text-success' : 'text-muted'}">${s.lastLoginAt || 'Belum pernah login'}</strong>

                  <div class="d-flex justify-content-between align-items-center">

              <div class="pandai-card text-center py-4 text-muted">
                <i class="bi bi-people fs-1 mb-2 d-block"></i>
                Belum ada Mitra Warung terdaftar di sistem.

              <div class="pandai-card p-3 mb-2">
                <div class="d-flex justify-content-between align-items-start mb-2">

                    <div class="fw-bold text-dark fs-6">${u.businessName || 'Warung Mitra'}</div>

                      <div class="fw-semibold text-dark text-truncate">${u.email}</div>

                      <span class="text-muted"><i class="bi bi-telephone me-1"></i>No. HP / WA:</span>

                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="text-muted"><i class="bi bi-clock-history me-1"></i>Waktu Login Terakhir:</span>
                    <strong class="${u.lastLoginAt ? 'text-success' : 'text-muted'}">${u.lastLoginAt || 'Belum pernah login'}</strong>
                  </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted"><i class="bi bi-shield-check me-1"></i>Frekuensi Login Berhasil:</span>
                    <span class="badge bg-primary-subtle text-primary">${u.loginSuccessCount || 0} Kali</span>
                  </div>

                <!-- Status Limit Kredit -->
                <div class="row g-2 mb-2 text-center small">
                  <div class="col-6">

                  </div>

                    <i class="bi bi-pencil-square me-1"></i> Sesuaikan Limit
                  </button>
                  <button class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3" onclick="openLimitHistoryModal('${u.id}')" title="Lihat Mutasi & Riwayat Limit">
                    <i class="bi bi-clock-history me-1"></i> Riwayat
