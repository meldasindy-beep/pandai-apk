    // Formulir & mutasi produk dinonaktifkan untuk role Admin Koperasi. Hak akses dipindahkan secara eksklusif ke Supplier mitra.
    function openAdminAddProductModal() {
      showToast('Kewenangan dialihkan: Penambahan produk sembako kini dikelola langsung oleh akun Supplier rekanan masing-masing.', 'warning');
    }

    function handleAdminAddProductSubmit(e) {
      if (e && e.preventDefault) e.preventDefault();
      showToast('Akses ditolak: Admin Koperasi hanya memiliki hak akses pemantauan katalog.', 'danger');
    }

    function openAdminEditProductModal(productId) {
      showToast('Kewenangan dialihkan: Pengeditan produk hanya dapat dilakukan secara mandiri oleh Supplier pemilik.', 'warning');
    }

    function handleAdminEditProductSubmit(e, prodId) {
      if (e && e.preventDefault) e.preventDefault();
      showToast('Akses ditolak: Admin Koperasi hanya memiliki hak akses pemantauan katalog.', 'danger');
    }

    function adminDeleteProduct(prodId) {
      showToast('Akses ditolak: Admin Koperasi tidak berhak menghapus produk milik rekanan Supplier.', 'danger');
    }

    function openAdminOrderDetailModal(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak: Menu ini khusus Admin Koperasi!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const buyer = users.find(u => u.id === order.userId);
      const uniqueSupplierIds = order.supplierIds || [...new Set((order.items || []).map(i => i.supplierId))];
      const suppliers = uniqueSupplierIds.map(sId => {
        const supUser = users.find(u => u.id === sId);
        const itemWithSup = (order.items || []).find(i => i.supplierId === sId);
        return {
          id: sId,
          businessName: (supUser && supUser.businessName) || (itemWithSup && itemWithSup.supplierName) || 'PT Pangan Nusantara Grosir',
          picName: (supUser && supUser.name) || 'Penanggung Jawab Supplier',
          phone: (supUser && supUser.phone) || '-',
          confirmation: (order.supplierConfirmations && order.supplierConfirmations[sId]) || null
        };
      });

      const steps = order.trackingSteps && order.trackingSteps.length === 7 
        ? order.trackingSteps 
        : createCanonicalTrackingSteps(order.date);

      openModal(`
        <div class="p-3 text-start">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <span class="badge bg-secondary mb-1">Audit Trail Transaksi #${order.id}</span>
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-file-earmark-text text-primary me-1"></i> Detail Lengkap Pesanan & Logistik</h6>
            </div>
            <button class="btn btn-sm btn-light rounded-circle" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>

          <!-- Status & Waktu Header -->
          <div class="d-flex justify-content-between align-items-center p-2 rounded bg-light mb-3">
            <div>
              <small class="text-muted d-block" style="font-size:0.7rem;">Status Operasional Terkini:</small>
              <div>${getOrderStatusBadge(order.status)}</div>
            </div>
            <div class="text-end" style="font-size:0.72rem;">
              <div><span class="text-muted">Tanggal Order:</span> <strong class="text-dark">${order.date}</strong></div>
              <div><span class="text-muted">Update Terakhir:</span> <strong class="text-primary">${order.lastUpdated || order.date}</strong></div>
            </div>
          </div>

          <!-- Rincian Nilai Transaksi & Pembayaran -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 d-flex justify-content-between align-items-center border-bottom pb-1">
              <span><i class="bi bi-wallet2 text-success me-1"></i>Nilai Transaksi & Pembayaran:</span>
              <span class="badge bg-success-subtle text-success border border-success">${order.paymentMethod}</span>
            </div>
            <div class="row g-1 pt-1">
              <div class="col-6">
                <span class="text-muted">Subtotal Barang:</span>
                <div class="fw-semibold text-dark">${formatRupiah(order.subtotal || order.total)}</div>
              </div>
              <div class="col-6 text-end">
                <span class="text-muted">Total Tagihan:</span>
                <div class="fw-bold text-success fs-6">${formatRupiah(order.total)}</div>
              </div>
            </div>
          </div>

          <!-- Status & Bukti Pembayaran Resmi di Detail Admin -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 border-bottom pb-1 d-flex justify-content-between align-items-center">
              <span><i class="bi bi-receipt text-primary me-1"></i>Verifikasi Bukti Pembayaran:</span>
              <div>${getPaymentStatusBadge(order.paymentStatus || 'Menunggu Pembayaran')}</div>
            </div>
            ${order.paymentProof ? `
              <div class="p-2 rounded bg-light border mt-2">
                <div class="d-flex gap-2 align-items-start">
                  ${order.paymentProof.fileType && order.paymentProof.fileType.includes('pdf') ? `
                    <div class="rounded bg-danger-subtle text-danger d-flex align-items-center justify-content-center p-2" style="width:55px; height:55px; flex-shrink:0;">
                      <i class="bi bi-file-earmark-pdf fs-2"></i>
                    </div>
                  ` : `
                    <img src="${order.paymentProof.fileData}" class="rounded border shadow-sm" style="width:55px; height:55px; object-fit:cover; flex-shrink:0; cursor:pointer;" onclick="openViewPaymentProofModal('${order.id}')" title="Klik untuk memperbesar bukti">
                  `}
                  <div class="flex-grow-1" style="font-size:0.72rem;">
                    <div class="fw-bold text-dark">${order.paymentProof.fileName}</div>
                    <div class="text-muted">Pengirim: <strong>${order.paymentProof.senderBank || '-'}</strong> a.n. <strong>${order.paymentProof.senderName || '-'}</strong></div>
                    <div class="text-muted">Diunggah: <strong>${order.paymentProof.uploadedAt}</strong> (${Math.round((order.paymentProof.fileSize || 0) / 1024)} KB)</div>
                    ${order.paymentProof.notes ? `<div class="text-primary fst-italic mt-1">"${order.paymentProof.notes}"</div>` : ''}
                  </div>
                </div>

                ${order.paymentStatus === 'Ditolak' ? `
                  <div class="alert alert-danger p-1 mt-2 mb-1" style="font-size:0.7rem;">
                    <i class="bi bi-x-circle-fill me-1"></i><strong>Alasan Ditolak:</strong> ${order.paymentRejectionReason}
                  </div>
                ` : ''}

                <div class="d-flex gap-2 mt-2 pt-2 border-top flex-wrap">
                  <button class="btn btn-sm btn-outline-primary flex-fill rounded-pill py-1 fw-semibold" style="font-size:0.72rem;" onclick="openViewPaymentProofModal('${order.id}')">
                    <i class="bi bi-eye me-1"></i> Buka Bukti Lengkap
                  </button>
                  ${order.paymentStatus !== 'Terverifikasi' ? `
                    <button class="btn btn-sm btn-success flex-fill rounded-pill py-1 fw-semibold" style="font-size:0.72rem;" onclick="handleAdminVerifyPayment('${order.id}', true)">
                      <i class="bi bi-check-circle-fill me-1"></i> Setujui Pembayaran
                    </button>
                    <button class="btn btn-sm btn-outline-danger flex-fill rounded-pill py-1 fw-semibold" style="font-size:0.72rem;" onclick="openAdminRejectPaymentModal('${order.id}')">
                      <i class="bi bi-x-circle me-1"></i> Tolak Pembayaran
                    </button>
                  ` : `
                    <span class="badge bg-success-subtle text-success border border-success py-1 px-2 d-flex align-items-center"><i class="bi bi-check-all me-1 fs-6"></i> Terverifikasi Sah</span>
                  `}
                </div>
              </div>
            ` : `
              <div class="p-2 text-muted small mt-1" style="font-size:0.72rem;">
                <i class="bi bi-info-circle me-1"></i>Customer belum mengunggah berkas bukti pembayaran untuk transaksi ini.
              </div>
            `}
          </div>

          <!-- Informasi Pembeli UMKM -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 border-bottom pb-1">
              <i class="bi bi-shop text-primary me-1"></i>Informasi Pembeli (Mitra Warung UMKM):
            </div>
            <div class="row g-1 pt-1">
              <div class="col-7">
                <div class="fw-bold text-dark">${order.buyerName || (buyer ? buyer.name : 'Mitra Warung')}</div>
                <div class="text-muted">${order.businessName || (buyer ? buyer.businessName : 'Warung Kelontong')}</div>
              </div>
              <div class="col-5 text-end">
                <div class="text-muted"><i class="bi bi-telephone me-1"></i>${order.buyerPhone || (buyer ? buyer.phone : '-')}</div>
              </div>
              <div class="col-12 mt-1">
                <span class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i>Alamat Pengantaran:</span>
                <div class="text-dark">${order.shippingAddress || (buyer ? buyer.address : '-')}</div>
              </div>
              ${order.shippingNotes ? `
                <div class="col-12 mt-1 text-primary fst-italic">
                  <i class="bi bi-chat-left-dots me-1"></i>Catatan Pembeli: "${order.shippingNotes}"
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Informasi Rekanan Supplier Pengirim -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 border-bottom pb-1">
              <i class="bi bi-building text-success me-1"></i>Pemasok Pengirim (Supplier):
            </div>
            <div class="d-grid gap-2 pt-1">
              ${suppliers.map(sup => `
                <div class="p-2 rounded bg-light">
                  <div class="d-flex justify-content-between align-items-center">
                    <div>
                      <strong class="text-dark">${sup.businessName}</strong>
                      <div class="text-muted" style="font-size:0.7rem;">PIC: ${sup.picName} • Telp: ${sup.phone}</div>
                    </div>
                    <div>
                      ${sup.confirmation && sup.confirmation.status === 'Dikonfirmasi'
                        ? `<span class="badge bg-success-subtle text-success border border-success">Stok Dikonfirmasi (${sup.confirmation.confirmedAt || 'OK'})</span>`
                        : sup.confirmation && sup.confirmation.status === 'Ditolak'
                          ? `<span class="badge bg-danger-subtle text-danger border border-danger">Ditolak: ${sup.confirmation.rejectionReason || '-'}</span>`
                          : `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning">Menunggu Konfirmasi</span>`
                      }
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Rincian Produk Pesanan -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 border-bottom pb-1">
              <i class="bi bi-boxes text-info me-1"></i>Rincian Barang Dipesan (${order.items ? order.items.length : 0} item):
            </div>
            <div class="d-grid gap-1 pt-1">
              ${(order.items || []).map(it => `
                <div class="d-flex justify-content-between align-items-center py-1 border-bottom-dashed">
                  <div>
                    <div class="fw-semibold text-dark">${it.name}</div>
                    <div class="text-muted" style="font-size:0.68rem;">
                      ${it.qty} ${it.unit || ''} x ${formatRupiah(it.price)} • <span class="text-secondary">${it.supplierName || 'Supplier'}</span>
                    </div>
                  </div>
                  <strong class="text-dark">${formatRupiah(it.subtotal || it.price * it.qty)}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Informasi Logistik & Pengiriman Mandiri Supplier -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark mb-1 border-bottom pb-1 d-flex justify-content-between align-items-center">
              <span><i class="bi bi-truck text-primary me-1"></i>Data Logistik & Pengiriman Mandiri:</span>
              ${order.trackingNumber ? `<span class="badge bg-primary text-white">Resi: ${order.trackingNumber}</span>` : '<span class="badge bg-light text-muted border">Belum Ada Resi</span>'}
            </div>
            <div class="row g-2 pt-1">
              <div class="col-6">
                <span class="text-muted">Metode Pengiriman:</span>
                <div class="fw-semibold text-dark">${order.deliveryMethod || 'Ditangani Mandiri oleh Supplier'}</div>
              </div>
              <div class="col-6">
                <span class="text-muted">Jadwal / Waktu Berangkat:</span>
                <div class="fw-semibold text-dark">${order.deliverySchedule || '-'}</div>
              </div>
              <div class="col-6">
                <span class="text-muted">Nama Kurir / Driver:</span>
                <div class="fw-semibold text-dark">${order.courierName || '<span class="text-muted fst-italic">Belum diinput Supplier</span>'}</div>
              </div>
              <div class="col-6">
                <span class="text-muted">No. Kontak Kurir:</span>
                <div class="fw-semibold text-dark">${order.courierPhone || '-'}</div>
              </div>
              ${order.deliveryNotes ? `
                <div class="col-12 text-muted pt-1 border-top" style="font-size:0.7rem;">
                  <span class="fw-medium">Catatan Logistik:</span> ${order.deliveryNotes}
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Riwayat Lengkap 7 Tahap (Audit Trail Kronologis) -->
          <div class="pandai-card p-2 bg-white border mb-3" style="font-size:0.72rem;">
            <div class="fw-bold text-dark mb-2 border-bottom pb-1">
              <i class="bi bi-clock-history text-secondary me-1"></i>Kronologi Riwayat Status (Audit Trail):
            </div>
            <div class="d-grid gap-2">
              ${steps.map(s => `
                <div class="d-flex align-items-start gap-2">
                  <div class="rounded-circle d-flex align-items-center justify-content-center text-white" style="width:20px; height:20px; font-size:0.65rem; flex-shrink:0; background: ${s.done ? '#198754' : s.active ? '#0d6efd' : '#cbd5e1'};">
                    <i class="bi ${s.done ? 'bi-check-lg' : s.active ? 'bi-arrow-repeat' : 'bi-circle'}"></i>
                  </div>
                  <div class="flex-grow-1">
                    <div class="fw-semibold ${s.done ? 'text-dark' : s.active ? 'text-primary' : 'text-muted'}">
                      Tahap ${s.step}: ${s.title}
                    </div>
                    <div class="text-muted" style="font-size:0.68rem;">
                      ${s.done 
                        ? `<span class="text-success"><i class="bi bi-check2 me-1"></i>Selesai pada: ${s.time || order.date}</span>` 
                        : s.active 
                          ? `<span class="badge bg-primary-subtle text-primary border border-primary-subtle py-0">Sedang Berjalan</span>` 
                          : 'Belum Berjalan'}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary rounded-pill flex-fill py-2" onclick="openOrderTrackingModal('${order.id}')">
              <i class="bi bi-geo-alt me-1"></i> Tampilan Pelacakan UMKM
            </button>
            <button class="btn btn-sm btn-secondary rounded-pill flex-fill py-2" onclick="closeModal()">
              Tutup
            </button>
          </div>
        </div>
      `);
    }

    function openAdminDispatchModal(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang berwenang mengelola pengiriman!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) return;

      const defaultTrackingNo = order.trackingNumber || ('SJ-PND-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(1000 + Math.random() * 9000));
      const defaultMethod = order.deliveryMethod || 'Armada Pick-Up Logistik Koperasi PANDAI';
      const defaultCourier = order.courierName || 'Dimas Arya Pratama, S.P. (Armada PANDAI)';
      const defaultPhone = order.courierPhone || '0895363103296';
      const defaultSchedule = order.deliverySchedule || 'Hari Ini, Estimasi 13.00 - 16.00 WIB';

      openModal(`
        <div class="p-3 text-start">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <span class="badge bg-secondary mb-1">Pesanan #${order.id}</span>
              <h6 class="fw-bold text-dark mb-0"><i class="bi bi-truck text-success me-1"></i> Atur & Jadwalkan Pengiriman</h6>
            </div>
            <button class="btn btn-sm btn-light rounded-circle" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>

          <div class="p-2 rounded bg-light mb-3" style="font-size:0.75rem;">
            <div class="fw-bold text-dark">${order.buyerName || 'Mitra Warung'} (${order.businessName || '-'})</div>
            <div class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i>${order.shippingAddress || '-'}</div>
            <div class="text-muted mt-1"><i class="bi bi-box-seam me-1 text-primary"></i>Total ${order.items ? order.items.length : 0} item senilai <strong>${formatRupiah(order.total)}</strong></div>
          </div>

          <form onsubmit="handleAdminSaveDeliveryPlan(event, '${order.id}')">
            <div class="mb-2">
              <label class="form-label small fw-semibold text-dark mb-1">Metode / Armada Pengiriman <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" id="adminDeliveryMethod" required>
                <option value="Armada Pick-Up Logistik Koperasi PANDAI" ${defaultMethod === 'Armada Pick-Up Logistik Koperasi PANDAI' ? 'selected' : ''}>Armada Pick-Up Logistik Koperasi PANDAI</option>
                <option value="Kurir Lapangan / Field Officer Pendamping" ${defaultMethod === 'Kurir Lapangan / Field Officer Pendamping' ? 'selected' : ''}>Kurir Lapangan / Field Officer Pendamping</option>
                <option value="Armada Langsung Pemasok (Supplier Direct)" ${defaultMethod === 'Armada Langsung Pemasok (Supplier Direct)' ? 'selected' : ''}>Armada Langsung Pemasok (Supplier Direct)</option>
                <option value="Jasa Ekspedisi Logistik Kargo Rekanan" ${defaultMethod === 'Jasa Ekspedisi Logistik Kargo Rekanan' ? 'selected' : ''}>Jasa Ekspedisi Logistik Kargo Rekanan</option>
              </select>
            </div>

            <div class="mb-2">
              <label class="form-label small fw-semibold text-dark mb-1">Jadwal Pengiriman / Estimasi Tiba <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm" id="adminDeliverySchedule" value="${defaultSchedule}" placeholder="Contoh: Hari Ini, 14.00 WIB" required>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-7">
                <label class="form-label small fw-semibold text-dark mb-1">Nama Petugas / Driver <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-sm" id="adminCourierName" value="${defaultCourier}" placeholder="Nama lengkap petugas" required>
              </div>
              <div class="col-5">
                <label class="form-label small fw-semibold text-dark mb-1">No. HP / WA Petugas <span class="text-danger">*</span></label>
                <input type="tel" class="form-control form-control-sm" id="adminCourierPhone" value="${defaultPhone}" placeholder="08..." required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small fw-semibold text-dark mb-1">No. Resi / Surat Jalan (Auto) <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm" id="adminTrackingNumber" value="${defaultTrackingNo}" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark mb-1">Catatan Pengiriman Petugas</label>
              <textarea class="form-control form-control-sm" id="adminDeliveryNotes" rows="2" placeholder="Catatan instruksi khusus pengantaran...">${order.deliveryNotes || ''}</textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-light flex-fill rounded-pill py-2" onclick="closeModal()">Batal</button>
              <button type="submit" class="btn btn-sm btn-pandai-primary text-white flex-fill rounded-pill py-2 fw-semibold shadow-sm">
                Simpan Jadwal Pengiriman
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function handleAdminSaveDeliveryPlan(e, orderId) {
      if (e && e.preventDefault) e.preventDefault();
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang berwenang menyimpan data pengiriman!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      const methodEl = document.getElementById('adminDeliveryMethod');
      const schedEl = document.getElementById('adminDeliverySchedule');
      const courierEl = document.getElementById('adminCourierName');
      const phoneEl = document.getElementById('adminCourierPhone');
      const trackingEl = document.getElementById('adminTrackingNumber');
      const notesEl = document.getElementById('adminDeliveryNotes');

      order.deliveryMethod = methodEl ? methodEl.value : order.deliveryMethod;
      order.deliverySchedule = schedEl ? schedEl.value : order.deliverySchedule;
      order.courierName = courierEl ? courierEl.value : order.courierName;
      order.courierPhone = phoneEl ? phoneEl.value : order.courierPhone;
      order.trackingNumber = trackingEl ? trackingEl.value : order.trackingNumber;
      order.deliveryNotes = notesEl ? notesEl.value : order.deliveryNotes;

      const nowStr = getNowFormattedString();

      // Transisi status jika sebelumnya Pesanan Dikonfirmasi Supplier atau Menunggu Konfirmasi
      if (order.status === 'Pesanan Dikonfirmasi Supplier' || order.status === 'Menunggu Konfirmasi Supplier') {
        order.status = 'Diproses Admin untuk Pengiriman';
      }

      // Update 7 tahapan pelacakan
      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }
      // Step 3 (Dikonfirmasi Supplier) done
      order.trackingSteps[2].done = true;
      order.trackingSteps[2].active = false;
      if (!order.trackingSteps[2].time) order.trackingSteps[2].time = nowStr;

      // Step 4: Diproses Admin untuk Pengiriman -> Done & Active
      order.trackingSteps[3].done = true;
      order.trackingSteps[3].active = true;
      order.trackingSteps[3].time = nowStr;

      State.saveOrders();
      closeModal();
      showToast(`Jadwal pengiriman pesanan #${order.id} berhasil disimpan! Status: Diproses Admin untuk Pengiriman.`, 'success');
      renderApp();
    }

    function handleAdminStartDelivery(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang berwenang memberangkatkan armada!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }
      if (!order.courierName || !order.deliveryMethod) {
        showToast('Harap atur data kurir dan armada pengiriman terlebih dahulu!', 'warning');
        openAdminDispatchModal(orderId);
        return;
      }

      const nowStr = getNowFormattedString();
      order.status = 'Dalam Pengiriman';

      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }
      order.trackingSteps[3].done = true;
      order.trackingSteps[3].active = false;

      // Step 5: Armada / Petugas Mulai Mengirim -> Done & Active
      order.trackingSteps[4].done = true;
      order.trackingSteps[4].active = true;
      order.trackingSteps[4].time = nowStr;

      State.saveOrders();
      showToast(`Armada telah diberangkatkan! Status pesanan #${order.id} kini "Dalam Pengiriman".`, 'success');
      renderApp();
    }

    function handleAdminMarkDelivered(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang berwenang mengonfirmasi penerimaan!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      const nowStr = getNowFormattedString();
      order.status = 'Pesanan Diterima di Warung';

      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }
      order.trackingSteps[4].active = false;

      // Step 6: Pesanan Diterima di Warung -> Done & Active
      order.trackingSteps[5].done = true;
      order.trackingSteps[5].active = true;
      order.trackingSteps[5].time = nowStr;

      State.saveOrders();
      showToast(`Pesanan #${order.id} telah diverifikasi sampai di warung mitra!`, 'success');
      renderApp();
    }

    function handleAdminFinalizeOrder(orderId) {
      if (!State.currentUser || State.currentUser.role !== 'admin') {
        showToast('Akses ditolak!', 'danger');
        return;
      }
      const order = State.orders.find(o => o.id === orderId);
      if (!order) return;

      const nowStr = getNowFormattedString();
      order.status = 'Pesanan Selesai';

      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }
      order.trackingSteps[5].active = false;

      // Step 7: Pesanan Selesai -> Done
      order.trackingSteps[6].done = true;
      order.trackingSteps[6].active = false;
      order.trackingSteps[6].time = nowStr;

      State.saveOrders();
      showToast(`Pesanan #${order.id} telah resmi selesai seluruh proses operasionalnya.`, 'success');
      renderApp();
    }

    function adminUpdateOrderStatus(orderId, newStatus) {
      const order = State.orders.find(o => o.id === orderId);
      if (order) {
        order.status = newStatus;
        const nowStr = getNowFormattedString();
        if (!order.trackingSteps || order.trackingSteps.length !== 7) {
          order.trackingSteps = createCanonicalTrackingSteps(order.date);
        }

        if (newStatus === 'Pesanan Dikonfirmasi Supplier') {
          order.trackingSteps[1].done = true; order.trackingSteps[1].active = false;
          order.trackingSteps[2].done = true; order.trackingSteps[2].active = true; order.trackingSteps[2].time = nowStr;
        } else if (newStatus === 'Diproses Admin untuk Pengiriman') {
          order.trackingSteps[2].done = true; order.trackingSteps[2].active = false;
          order.trackingSteps[3].done = true; order.trackingSteps[3].active = true; order.trackingSteps[3].time = nowStr;
        } else if (newStatus === 'Dalam Pengiriman') {
          order.trackingSteps[3].done = true; order.trackingSteps[3].active = false;
          order.trackingSteps[4].done = true; order.trackingSteps[4].active = true; order.trackingSteps[4].time = nowStr;
        } else if (newStatus === 'Pesanan Diterima di Warung') {
          order.trackingSteps[4].active = false;
          order.trackingSteps[5].done = true; order.trackingSteps[5].active = true; order.trackingSteps[5].time = nowStr;
        } else if (newStatus === 'Pesanan Selesai') {
          order.trackingSteps[5].active = false;
          order.trackingSteps[6].done = true; order.trackingSteps[6].active = false; order.trackingSteps[6].time = nowStr;
        }
        State.saveOrders();
        showToast(`Status pesanan #${orderId} diubah menjadi "${newStatus}"`, 'success');
        renderApp();
      }
    }

    function openAdminAdjustLimitModal(userId) {
      const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const user = users.find(u => u.id === userId);
      if (!user) return;

      openModal(`
        <div class="p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-dark">Sesuaikan Limit Kredit UMKM</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="mb-3 p-2 bg-light rounded small">
            <div>Anggota: <strong>${user.name} (${user.businessName || 'Warung'})</strong></div>
            <div>Plafon Saat Ini: <strong>${formatRupiah(user.creditLimit !== undefined ? user.creditLimit : INITIAL_CREDIT_LIMIT)}</strong></div>
            <div>Sisa Limit Saat Ini: <strong>${formatRupiah(user.remainingLimit !== undefined ? user.remainingLimit : INITIAL_CREDIT_LIMIT)}</strong></div>
            <div class="text-primary fw-semibold mt-1"><i class="bi bi-shield-check me-1"></i>Batas Maksimum Koperasi: ${formatRupiah(MAX_CREDIT_LIMIT)}</div>
          </div>

          <form onsubmit="handleAdminAdjustLimitSubmit(event, '${user.id}')">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Plafon Limit Baru (Maks. ${formatRupiah(MAX_CREDIT_LIMIT)})</label>
              <select id="adjNewLimit" class="form-select">
                <option value="300000" ${user.creditLimit === 300000 ? 'selected' : ''}>Rp 300.000 (Limit Standar Awal)</option>
                <option value="500000" ${user.creditLimit === 500000 ? 'selected' : ''}>Rp 500.000 (Tier Bronze Plus)</option>
                <option value="750000" ${user.creditLimit === 750000 ? 'selected' : ''}>Rp 750.000 (Tier Silver)</option>
                <option value="1000000" ${user.creditLimit === 1000000 ? 'selected' : ''}>Rp 1.000.000 (Tier Gold - Batas Maksimum)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Tingkat Tier</label>
              <select id="adjNewTier" class="form-select">
                <option value="Bronze" ${user.creditTier === 'Bronze' ? 'selected' : ''}>Bronze</option>
                <option value="Silver" ${user.creditTier === 'Silver' ? 'selected' : ''}>Silver</option>
                <option value="Gold" ${user.creditTier === 'Gold' ? 'selected' : ''}>Gold</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Catatan / Alasan Penyesuaian</label>
              <input type="text" id="adjLimitReason" class="form-control form-control-sm" placeholder="cth: Pembayaran disiplin, omzet warung meningkat" value="Penyesuaian limit berkala oleh Admin Koperasi">
            </div>

            <button type="submit" class="btn btn-pandai-primary w-100 py-2 fw-semibold">
              Simpan & Perbarui Plafon Limit
            </button>
          </form>
        </div>
      `);
    }

    function handleAdminAdjustLimitSubmit(e, userId) {
      e.preventDefault();
      const newLimit = Number(document.getElementById('adjNewLimit').value);
      const newTier = document.getElementById('adjNewTier').value;
      const reason = (document.getElementById('adjLimitReason') ? document.getElementById('adjLimitReason').value : '').trim() || 'Penyesuaian limit oleh Admin Koperasi';

      if (newLimit > MAX_CREDIT_LIMIT) {
        showToast(`Batas maksimum limit koperasi adalah ${formatRupiah(MAX_CREDIT_LIMIT)}!`, 'danger');
        return;
      }
      if (newLimit <= 0 || isNaN(newLimit)) {
        showToast('Nilai limit tidak valid!', 'danger');
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const uIdx = users.findIndex(u => u.id === userId);
      if (uIdx !== -1) {
        const oldLimit = users[uIdx].creditLimit !== undefined ? users[uIdx].creditLimit : INITIAL_CREDIT_LIMIT;
        const oldRemaining = users[uIdx].remainingLimit !== undefined ? users[uIdx].remainingLimit : INITIAL_CREDIT_LIMIT;
        const diff = newLimit - oldLimit;
        const newRemaining = Math.max(0, Math.min(newLimit, oldRemaining + diff));

        users[uIdx].creditLimit = newLimit;
        users[uIdx].remainingLimit = newRemaining;
        users[uIdx].creditTier = newTier;
        users[uIdx].limitHistory = users[uIdx].limitHistory || [];
        users[uIdx].limitHistory.push({
          id: 'lim_' + Date.now(),
          timestamp: new Date().toISOString(),
          type: 'PENYESUAIAN_ADMIN',
          description: `Penyesuaian limit oleh Admin Koperasi (${formatRupiah(oldLimit)} -> ${formatRupiah(newLimit)}): ${reason}`,
          changeAmount: diff,
          creditLimit: newLimit,
          remainingLimit: newRemaining,
          adminId: State.currentUser ? State.currentUser.id : 'adm_001',
          adminName: State.currentUser ? State.currentUser.name : 'Admin Koperasi'
        });

        State.saveUsers(users);

        if (State.currentUser && State.currentUser.id === userId) {
          State.currentUser = { ...users[uIdx] };
          localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(State.currentUser));
        }

        closeModal();
        showToast(`Limit kredit ${users[uIdx].name} berhasil disesuaikan menjadi ${formatRupiah(newLimit)}!`, 'success');
        renderApp();
      }
    }

    /* ==========================================================================
       14. MODAL CONTROLLER & PWA SERVICE WORKER
       ========================================================================== */
    let bsModalInstance = null;

    function openModal(htmlContent) {
      const modalEl = document.getElementById('pandaiModal');
      const contentEl = document.getElementById('pandaiModalContent');
      contentEl.innerHTML = htmlContent;

      if (!bsModalInstance) {
        bsModalInstance = new bootstrap.Modal(modalEl);
      }
      bsModalInstance.show();
    }

    function closeModal() {
      if (bsModalInstance) {
        bsModalInstance.hide();
      }
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('PWA Service Worker registered successfully with scope:', reg.scope);
        }).catch((err) => {
          console.warn('PWA Service Worker registration skipped or failed:', err);
        });
      });
    }

    // PWA Before Install Prompt Handler
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwaBannerContainer');
      if (banner) banner.style.display = 'block';
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            showToast('Terima kasih telah memasang aplikasi PANDAI!', 'success');
          }
          deferredPrompt = null;
          const banner = document.getElementById('pwaBannerContainer');
          if (banner) banner.style.display = 'none';
        });
      } else {
        showToast('Untuk menginstall di HP, pilih menu titik tiga browser lalu "Tambahkan ke Layar Utama" (Add to Home screen).', 'info');
      }
    }

    // Online / Offline Listeners
    window.addEventListener('offline', () => {
      const alert = document.getElementById('offlineAlert');
      if (alert) alert.style.display = 'block';
    });

    window.addEventListener('online', () => {
      const alert = document.getElementById('offlineAlert');
      if (alert) alert.style.display = 'none';
      showToast('Koneksi internet kembali online', 'success');
    });

    // Initial View Render
    renderApp();
  </script>
</body>
</html>
