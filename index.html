<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PANDAI - Koperasi Digital Sembako UMKM</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#16A34A">
  <meta name="description" content="Aplikasi Pengadaan Stok Sembako Langsung dari Supplier dengan Sistem Beli Sekarang Bayar Nanti untuk UMKM">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PANDAI">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Google Fonts Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --pandai-primary: #16A34A;
      --pandai-primary-dark: #0F5132;
      --pandai-primary-light: #DCFCE7;
      --pandai-accent: #F97316;
      --pandai-accent-hover: #EA580C;
      --pandai-accent-light: #FFEDD5;
      --pandai-bg: #F8FAFC;
      --pandai-card: #FFFFFF;
      --pandai-text-main: #1E293B;
      --pandai-text-muted: #64748B;
      --pandai-border: #E2E8F0;
      --pandai-shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --pandai-shadow-md: 0 4px 16px rgba(0,0,0,0.07);
      --pandai-shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #E2E8F0;
      color: var(--pandai-text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Mobile Container Wrapper */
    .app-viewport {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: var(--pandai-bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: max-width 0.3s ease;
    }

    .app-viewport.desktop-expanded {
      max-width: 1100px;
    }

    /* Custom Header */
    .app-header {
      background: linear-gradient(135deg, #15803D 0%, #16A34A 100%);
      color: #ffffff;
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 1020;
      box-shadow: 0 3px 12px rgba(22, 163, 74, 0.25);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .brand-badge {
      background-color: var(--pandai-accent);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      padding: 16px;
      padding-bottom: 95px; /* space for bottom nav */
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background-color: #ffffff;
      border-top: 1px solid var(--pandai-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 4px;
      z-index: 1030;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
      transition: max-width 0.3s ease;
    }

    .desktop-expanded .bottom-nav {
      max-width: 1100px;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--pandai-text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 6px;
      border-radius: 10px;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
      flex: 1;
    }

    .nav-btn i {
      font-size: 1.3rem;
      margin-bottom: 2px;
      transition: transform 0.2s;
    }

    .nav-btn.active {
      color: var(--pandai-primary);
      font-weight: 700;
    }

    .nav-btn.active i {
      transform: scale(1.15);
      color: var(--pandai-primary);
    }

    .nav-badge {
      position: absolute;
      top: 0;
      right: 22%;
      background-color: var(--pandai-accent);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* Buttons */
    .btn-pandai-primary {
      background-color: var(--pandai-primary);
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25);
      transition: all 0.2s;
    }
    .btn-pandai-primary:hover, .btn-pandai-primary:focus {
      background-color: #15803D;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-pandai-accent {
      background-color: var(--pandai-accent);
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
      transition: all 0.2s;
    }
    .btn-pandai-accent:hover, .btn-pandai-accent:focus {
      background-color: var(--pandai-accent-hover);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-pandai-outline {
      border: 1.5px solid var(--pandai-primary);
      color: var(--pandai-primary);
      background: transparent;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .btn-pandai-outline:hover {
      background: var(--pandai-primary-light);
      color: var(--pandai-primary-dark);
    }

    /* Custom Cards */
    .pandai-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--pandai-border);
      box-shadow: var(--pandai-shadow-sm);
      margin-bottom: 16px;
      position: relative;
    }

    .pandai-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Credit Limit Card Banner */
    .credit-card-gradient {
      background: linear-gradient(135deg, #14532D 0%, #16A34A 70%, #22C55E 100%);
      color: white;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(22, 163, 74, 0.3);
      margin-bottom: 18px;
    }

    .credit-card-gradient::after {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      top: -40px;
      right: -30px;
      pointer-events: none;
    }

    /* Product Card */
    .product-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--pandai-border);
      box-shadow: var(--pandai-shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      height: 100%;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--pandai-shadow-md);
    }

    .product-img-box {
      height: 140px;
      background: #F1F5F9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .supplier-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 81, 50, 0.9);
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .promo-chip {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--pandai-accent);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* Installment Stepper / Tenor Box */
    .tenor-box {
      border: 2px solid var(--pandai-border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: #ffffff;
      position: relative;
    }

    .tenor-box.selected {
      border-color: var(--pandai-primary);
      background-color: var(--pandai-primary-light);
    }

    .tenor-box .badge-popular {
      position: absolute;
      top: -10px;
      right: 12px;
      background: var(--pandai-accent);
      color: white;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Offline Alert Bar */
    .offline-alert {
      display: none;
      background-color: #EF4444;
      color: white;
      text-align: center;
      padding: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* PWA Install Banner */
    .pwa-banner {
      background: linear-gradient(90deg, #FFEDD5 0%, #FED7AA 100%);
      border: 1px solid #FDBA74;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Category Scroll Bar */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      background: #ffffff;
      color: var(--pandai-text-muted);
      border: 1px solid var(--pandai-border);
      transition: all 0.2s;
    }

    .category-chip.active {
      background: var(--pandai-primary);
      color: #ffffff;
      border-color: var(--pandai-primary);
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
    }

    /* Order Tracking Stepper */
    .tracking-step {
      display: flex;
      align-items: flex-start;
      position: relative;
      padding-bottom: 16px;
    }
    .tracking-step:last-child {
      padding-bottom: 0;
    }
    .tracking-step::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 26px;
      bottom: 0;
      width: 2px;
      background: #CBD5E1;
    }
    .tracking-step:last-child::before {
      display: none;
    }
    .tracking-step.done::before {
      background: var(--pandai-primary);
    }
    .step-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #E2E8F0;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      margin-right: 12px;
      z-index: 2;
    }
    .tracking-step.done .step-icon {
      background: var(--pandai-primary);
      color: #fff;
    }
    .tracking-step.active .step-icon {
      background: var(--pandai-accent);
      color: #fff;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.2);
    }

    /* Modal Styling */
    .modal-content {
      border-radius: 20px;
      border: none;
      box-shadow: var(--pandai-shadow-lg);
    }

    /* Custom Form */
    .form-control, .form-select {
      border-radius: 12px;
      padding: 10px 14px;
      border: 1.5px solid var(--pandai-border);
      font-size: 0.9rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--pandai-primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }

    /* Floating Toast Notification */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1090;
      width: 90%;
      max-width: 440px;
      pointer-events: none;
    }
    .pandai-toast {
      pointer-events: auto;
      background: #1E293B;
      color: #ffffff;
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Responsive Grid for Expanded Mode */
    .desktop-expanded .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Badge Tags */
    .badge-bnpl {
      background: #FEF3C7;
      color: #92400E;
      font-weight: 600;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* QRIS STANDAR & CARD STYLES */
    .qris-card {
      background: #ffffff;
      border: 1.5px solid #E2E8F0;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
    }
    .qris-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid #DC2626;
      margin-bottom: 10px;
    }
    .qris-brand-title {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: #0F172A;
      line-height: 1;
    }
    .qris-brand-title span {
      color: #DC2626;
    }
    .qris-gpn-tag {
      background: #DC2626;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .qris-merchant-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1E293B;
      margin-bottom: 1px;
    }
    .qris-nmid-text {
      font-size: 0.72rem;
      color: #64748B;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    .qris-box-wrapper {
      background: #ffffff;
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      padding: 10px;
      display: inline-block;
      margin: 8px 0;
      position: relative;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .qris-amount-badge {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 8px 12px;
      margin-top: 6px;
      margin-bottom: 10px;
    }
    .qris-timer-pill {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FEE2E2;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .qris-step-guide {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.74rem;
      color: #475569;
      margin-top: 10px;
    }
    .qris-app-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 8px;
    }
    .qris-app-badge {
      background: #F1F5F9;
      color: #334155;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #E2E8F0;
    }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Viewport Container -->
  <div class="app-viewport" id="appViewport">
    
    <!-- Offline Indicator -->
    <div class="offline-alert" id="offlineAlert">
      <i class="bi bi-wifi-off me-1"></i> Mode Offline - Anda masih dapat melihat data tersimpan
    </div>

    <!-- APP HEADER -->
    <header class="app-header" id="mainHeader">
      <div class="d-flex justify-content-between align-items-center">
        <div class="brand-logo" onclick="switchTab('home')" style="cursor: pointer;">
          <img src="logo-icon.png" alt="Logo PANDAI" style="width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));">
          <div class="d-flex flex-column" style="line-height: 1.1;">
            <span style="font-weight: 800; letter-spacing: 0.5px;">PANDAI</span>
            <span style="font-size: 0.58rem; color: #DCFCE7; font-weight: 500; letter-spacing: 0.2px;">Pangan Digital Indonesia</span>
          </div>
          <span class="brand-badge ms-1" id="headerRoleBadge">UMKM</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <!-- Toggle View Mode (Mobile / Desktop expanded) -->
          <button class="btn btn-sm btn-outline-light rounded-pill px-2 py-1" onclick="toggleViewportMode()" title="Ganti Mode Tampilan (HP / Lebar)" id="toggleViewportBtn">
            <i class="bi bi-arrows-angle-expand"></i>
          </button>
          
          <!-- Cart Quick Icon (User Only) -->
          <button class="btn btn-sm btn-light rounded-circle position-relative p-2" id="headerCartBtn" onclick="switchTab('cart')" title="Keranjang Belanja">
            <i class="bi bi-cart3 text-success font-weight-bold"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCountBadge" style="display:none;">0</span>
          </button>

          <!-- Quick Role Switcher / Profile Shortcut -->
          <button class="btn btn-sm btn-light rounded-circle p-2" id="headerProfileBtn" onclick="openProfileOrLogout()" title="Menu Akun">
            <i class="bi bi-person-circle text-success"></i>
          </button>
        </div>
      </div>

      <!-- User Greeting Bar (Hidden on Auth views) -->
      <div class="mt-2 pt-1 border-top border-success-subtle d-flex justify-content-between align-items-center text-white" id="headerGreetingBar" style="display: none;">
        <div>
          <small class="opacity-75 d-block" style="font-size: 0.72rem;">Selamat datang,</small>
          <span class="fw-semibold" id="headerUserName" style="font-size: 0.88rem;">Ibu Siti Aminah</span>
          <span class="badge bg-warning text-dark ms-1" style="font-size: 0.65rem;" id="headerStoreName">Warung Berkah</span>
        </div>
        <div class="text-end">
          <span class="badge bg-success-subtle text-white border border-light-subtle rounded-pill" style="font-size: 0.68rem;" id="headerCreditTierBadge">
            <i class="bi bi-patch-check-fill text-warning me-1"></i>Tier Gold
          </span>
        </div>
      </div>
    </header>

    <!-- PWA Install Prompt Bar -->
    <div class="px-3 pt-2" id="pwaBannerContainer" style="display: none;">
      <div class="pwa-banner">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-phone-fill fs-4 text-warning"></i>
          <div>
            <div class="fw-bold text-dark" style="font-size: 0.82rem;">Pasang Aplikasi PANDAI</div>
            <div class="text-muted" style="font-size: 0.72rem;">Akses cepat & hemat kuota di layar utama HP</div>
          </div>
        </div>
        <button class="btn btn-sm btn-pandai-accent px-3 py-1" onclick="triggerPWAInstall()">Pasang</button>
      </div>
    </div>

    <!-- MAIN DYNAMIC CONTENT CONTAINER -->
    <main class="app-content" id="appContent">
      <!-- Dynamic Views Loaded via JavaScript -->
    </main>

    <!-- BOTTOM NAVIGATION (Only visible for logged in UMKM User) -->
    <nav class="bottom-nav" id="bottomNav" style="display: none;">
      <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
        <i class="bi bi-house-door-fill"></i>
        <span>Beranda</span>
      </button>
      <button class="nav-btn" id="nav-catalog" onclick="switchTab('catalog')">
        <i class="bi bi-grid-fill"></i>
        <span>Katalog</span>
      </button>
      <button class="nav-btn" id="nav-cart" onclick="switchTab('cart')">
        <i class="bi bi-cart-fill"></i>
        <span>Keranjang</span>
        <span class="nav-badge" id="bottomNavCartBadge" style="display:none;">0</span>
      </button>
      <button class="nav-btn" id="nav-installments" onclick="switchTab('installments')">
        <i class="bi bi-credit-card-2-front-fill"></i>
        <span>Cicilan</span>
        <span class="nav-badge" id="bottomNavDueBadge" style="display:none;">!</span>
      </button>
      <button class="nav-btn" id="nav-orders" onclick="switchTab('orders')">
        <i class="bi bi-box-seam-fill"></i>
        <span>Pesanan</span>
      </button>
      <button class="nav-btn" id="nav-mentor" onclick="switchTab('mentor')">
        <i class="bi bi-person-badge-fill"></i>
        <span>Pendamping</span>
      </button>
    </nav>
  </div>

  <!-- MODAL CONTAINER (Generic Dynamic Modal) -->
  <div class="modal fade" id="pandaiModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">

        hash = hash & hash;

      } else if (status === 'Pesanan Diterima' || status === 'Pesanan Dikonfirmasi Supplier') {
        return '<span class="badge bg-info text-dark"><i class="bi bi-check2-circle me-1"></i>Pesanan Diterima</span>';

        return '<span class="badge bg-primary-subtle text-primary border border-primary-subtle"><i class="bi bi-gear-fill me-1"></i>Diproses</span>';
      } else if (status === 'Dikemas') {
        return '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle"><i class="bi bi-box-seam me-1"></i>Dikemas</span>';
      } else if (status === 'Dikirim' || status === 'Dalam Pengiriman' || status === 'Diproses Admin untuk Pengiriman') {
        return '<span class="badge bg-primary text-white"><i class="bi bi-truck me-1"></i>Dikirim</span>';

      } else if (status === 'Ditolak' || status === 'Ditolak Supplier') {

      } else if (status === 'Dibatalkan') {

        // Migration: Ensure all existing products have supplierId and supplierName

          let prodsModified = false;
          storedProds.forEach(p => {
            if (!p.supplierId) {
              p.supplierId = 'sup_001';
              if (!p.supplierName) {
                p.supplierName = 'PT Pangan Nusantara Grosir';

          console.warn('Product migration error:', e);

      if (!localStorage.getItem(STORAGE_KEYS.USERS)) {
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(DEFAULT_USERS));
      } else {
        // Migration: Ensure existing users have registeredAt, login tracking, and calibrated credit limit (Initial Rp 300k, Max Rp 1M)
        try {
          const storedUsers = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
          let modified = false;

          // Seed default demo supplier if not yet present in existing storage
          if (!storedUsers.some(u => u.role === 'supplier')) {
            storedUsers.push(DEFAULT_USERS[2]);
            modified = true;
          }

          storedUsers.forEach(u => {
            if (!u.registeredAt) {
              u.registeredAt = u.joinDate ? `${u.joinDate}, 08:30 WIB` : '15 Jan 2026, 08:30 WIB';
              modified = true;
            }
            if (!u.lastLoginAt) {
              u.lastLoginAt = u.registeredAt;
              u.lastLoginTimestamp = Date.now();
              modified = true;
            }
            if (u.loginSuccessCount === undefined) {
              u.loginSuccessCount = (u.role === 'admin' ? 28 : (u.role === 'supplier' ? 16 : 12));
              modified = true;
            }
            if (u.role === 'supplier' && !u.accountStatus) {
              u.accountStatus = 'Terverifikasi Koperasi';
              modified = true;
            }
            // Calibrate Saldo/Limit rules (Rule A.1, A.2, A.8)
            if (u.role === 'user') {
              if (u.creditLimit === undefined || u.creditLimit === null || !u.limitInitialized) {
                u.creditLimit = INITIAL_CREDIT_LIMIT;
                u.remainingLimit = INITIAL_CREDIT_LIMIT;
                u.limitInitialized = true;
                if (!u.limitHistory) {
                  u.limitHistory = [{ date: u.registeredAt || getNowFormattedString(), type: 'init', amount: INITIAL_CREDIT_LIMIT, remaining: INITIAL_CREDIT_LIMIT, ref: 'INIT-300K', notes: 'Plafon limit kredit awal Rp 300.000' }];
                }
                modified = true;
              } else if (u.creditLimit > MAX_CREDIT_LIMIT) {
                const oldLimit = u.creditLimit;
                u.creditLimit = MAX_CREDIT_LIMIT;
                u.remainingLimit = Math.min(MAX_CREDIT_LIMIT, Math.max(0, Number(u.remainingLimit) || 0));
                u.limitHistory = u.limitHistory || [];
                u.limitHistory.push({
                  date: getNowFormattedString(),
                  type: 'migration_cap',
                  amount: MAX_CREDIT_LIMIT,
                  remaining: u.remainingLimit,
                  ref: 'MIGRATE-MAX-1M',
                  notes: `Penyesuaian batas maksimum plafon limit kredit menjadi Rp 1.000.000 (sebelumnya ${formatRupiah(oldLimit)})`
                });
                modified = true;
              }
              if (!u.limitHistory) {
                u.limitHistory = [{ date: u.registeredAt || getNowFormattedString(), type: 'init', amount: u.creditLimit, remaining: u.remainingLimit, ref: 'INIT-300K', notes: 'Plafon limit kredit awal' }];
                modified = true;
              }
            }
          });
          if (modified) {
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(storedUsers));
          }

          console.warn('User migration check error:', e);

            if (o.items) {

            if (!o.supplierConfirmations) {

            if (!o.trackingSteps || o.trackingSteps.length !== 7) {

              const isInDelivery = o.status === 'Dalam Pengiriman';
              o.trackingSteps = [
                { step: 1, key: 'received', title: 'Pesanan Diterima Sistem', time: o.date || '10 Okt 09:30', done: true, active: false },
                { step: 2, key: 'waiting_supplier', title: 'Menunggu Konfirmasi Supplier', time: o.date || '10 Okt 09:30', done: true, active: (!isInDelivery && !isDone) },
                { step: 3, key: 'confirmed_supplier', title: 'Pesanan Dikonfirmasi Supplier', time: (isInDelivery || isDone) ? (o.date || '10 Okt 11:15') : '', done: (isInDelivery || isDone), active: false },

                { step: 5, key: 'shipping', title: 'Armada / Petugas Mulai Mengirim', time: (isInDelivery || isDone) ? (o.date || '10 Okt 14:00') : '', done: (isInDelivery || isDone), active: isInDelivery },
                { step: 6, key: 'delivered', title: 'Pesanan Diterima di Warung', time: isDone ? (o.date || '10 Okt 16:30') : '', done: isDone, active: false },
                { step: 7, key: 'completed', title: 'Pesanan Selesai', time: isDone ? (o.date || '10 Okt 16:35') : '', done: isDone, active: false }
              ];
              ordersModified = true;
            }
          });
          if (ordersModified) {
            localStorage.setItem(STORAGE_KEYS.ORDERS, JSON.stringify(storedOrders));
          }
        } catch(e) {
          console.warn('Orders migration error:', e);
        }
      }

        localStorage.setItem(STORAGE_KEYS.CART, JSON.stringify([]));

    }

    function formatRupiah(num) {
      if (num === undefined || num === null) return 'Rp 0';
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'pandai-toast';
      
      let icon = 'bi-info-circle-fill text-info';
      if (type === 'success') icon = 'bi-check-circle-fill text-success';
      if (type === 'warning') icon = 'bi-exclamation-triangle-fill text-warning';
      if (type === 'danger') icon = 'bi-x-circle-fill text-danger';

      toast.innerHTML = `
        <i class="bi ${icon} fs-5"></i>
        <div class="flex-grow-1" style="font-size: 0.86rem;">${message}</div>
        <button type="button" class="btn-close btn-close-white btn-sm" onclick="this.parentElement.remove()"></button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function toggleViewportMode() {
      const viewport = document.getElementById('appViewport');
      const btn = document.getElementById('toggleViewportBtn');
      State.isDesktopExpanded = !State.isDesktopExpanded;

      if (State.isDesktopExpanded) {
        viewport.classList.add('desktop-expanded');
        btn.innerHTML = '<i class="bi bi-arrows-angle-contract"></i>';
        showToast('Beralih ke mode tampilan lebar desktop', 'info');
      } else {
        viewport.classList.remove('desktop-expanded');
        btn.innerHTML = '<i class="bi bi-arrows-angle-expand"></i>';
        showToast('Beralih ke mode tampilan ponsel mobile', 'info');
      }
    }

    function updateCartBadges() {
      const count = State.cart.reduce((sum, item) => sum + item.qty, 0);
      const headerBadge = document.getElementById('cartCountBadge');
      const navBadge = document.getElementById('bottomNavCartBadge');

      if (count > 0) {
        headerBadge.style.display = 'inline-block';
        headerBadge.textContent = count;
        if (navBadge) {
          navBadge.style.display = 'inline-block';
          navBadge.textContent = count;
        }
      } else {
        headerBadge.style.display = 'none';
        if (navBadge) navBadge.style.display = 'none';
      }
    }

    /* ==========================================================================
       4. ROUTING & VIEW CONTROLLER
       ========================================================================== */
    function renderApp() {
      State.load();
      const content = document.getElementById('appContent');
      const bottomNav = document.getElementById('bottomNav');
      const greetingBar = document.getElementById('headerGreetingBar');
      const headerCartBtn = document.getElementById('headerCartBtn');
      const headerRoleBadge = document.getElementById('headerRoleBadge');

      // 1. If not logged in, show Auth Screen
      if (!State.currentUser) {
        bottomNav.style.display = 'none';
        greetingBar.style.display = 'none';
        headerCartBtn.style.display = 'none';
        headerRoleBadge.textContent = 'MASUK';
        content.innerHTML = renderAuthView();
        return;
      }

      // 2. If logged in as ADMIN
      if (State.currentUser.role === 'admin') {
        bottomNav.style.display = 'none';
        greetingBar.style.display = 'flex';
        headerCartBtn.style.display = 'none';
        headerRoleBadge.textContent = 'ADMIN';
        headerRoleBadge.className = 'brand-badge bg-danger';

        document.getElementById('headerUserName').textContent = State.currentUser.name;
        document.getElementById('headerStoreName').textContent = 'Koperasi PANDAI Pusat';
        document.getElementById('headerCreditTierBadge').innerHTML = '<i class="bi bi-shield-lock-fill text-warning me-1"></i>Akses Administrator';

        content.innerHTML = renderAdminPortal();
        return;
      }

      // 3. If logged in as SUPPLIER
      if (State.currentUser.role === 'supplier') {
        bottomNav.style.display = 'none';
        greetingBar.style.display = 'flex';
        headerCartBtn.style.display = 'none';
        headerRoleBadge.textContent = 'SUPPLIER';
        headerRoleBadge.className = 'brand-badge bg-info text-dark';

        document.getElementById('headerUserName').textContent = State.currentUser.name;
        document.getElementById('headerStoreName').textContent = State.currentUser.businessName || 'Pemasok Sembako PANDAI';
        document.getElementById('headerCreditTierBadge').innerHTML = '<i class="bi bi-truck text-info me-1"></i>Pemasok Terverifikasi';

        content.innerHTML = renderSupplierPortal();
        return;
      }

      // 4. If logged in as UMKM USER
      bottomNav.style.display = 'flex';
      greetingBar.style.display = 'flex';
      headerCartBtn.style.display = 'block';
      headerRoleBadge.textContent = 'UMKM';
      headerRoleBadge.className = 'brand-badge';

      document.getElementById('headerUserName').textContent = State.currentUser.name;
      document.getElementById('headerStoreName').textContent = State.currentUser.businessName || 'Warung Mitra';
      document.getElementById('headerCreditTierBadge').innerHTML = `<i class="bi bi-patch-check-fill text-warning me-1"></i>Tier ${State.currentUser.creditTier || 'Silver'}`;

      updateCartBadges();

      // Check due installments for bottom nav badge
      const dueCount = State.installments.filter(i => i.status === 'active' && i.dueDateDaysLeft <= 3).length;
      const dueBadge = document.getElementById('bottomNavDueBadge');
      if (dueBadge) {
        if (dueCount > 0) {
          dueBadge.style.display = 'inline-block';
        } else {
          dueBadge.style.display = 'none';
        }
      }

      // Render tab view
      switch (State.activeTab) {
        case 'home':
          content.innerHTML = renderHomeView();
          break;
        case 'catalog':
          content.innerHTML = renderCatalogView();
          break;
        case 'cart':
          content.innerHTML = renderCartView();
          break;
        case 'installments':
          content.innerHTML = renderInstallmentsView();
          break;
        case 'orders':
          content.innerHTML = renderOrdersView();
          break;
        case 'mentor':
          content.innerHTML = renderMentorView();
          break;
        case 'profile':
          content.innerHTML = renderProfileView();
          break;
        default:
          content.innerHTML = renderHomeView();
      }

      // Update active nav button
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`nav-${State.activeTab}`);
      if (activeBtn) activeBtn.classList.add('active');

      window.scrollTo(0, 0);
    }

    function switchTab(tabName) {
      State.activeTab = tabName;
      renderApp();

    // Catat waktu login berhasil dan frekuensi login pengguna ke database
    function recordSuccessfulLogin(userId) {
      const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const idx = users.findIndex(u => u.id === userId);
      if (idx !== -1) {
        const now = new Date();
        const nowStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
        
        users[idx].lastLoginAt = nowStr;
        users[idx].lastLoginTimestamp = Date.now();
        users[idx].loginSuccessCount = (Number(users[idx].loginSuccessCount) || 0) + 1;
        if (!users[idx].firstLoginAt) {
          users[idx].firstLoginAt = nowStr;
        }
        
        State.saveUsers(users);

        if (State.currentUser && State.currentUser.id === userId) {
          State.currentUser = users[idx];
          localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(users[idx]));
        }
        return users[idx];
      }
      return null;
    }

    /* ---------------------------------------------------------
       HANDLE UNIFIED LOGIN
       Verifikasi email & password, lalu tentukan dashboard berdasarkan
       role akun yang tersimpan dan terverifikasi di database.
       --------------------------------------------------------- */
    function handleUnifiedLogin(e) {
      if (e) e.preventDefault();
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const rememberInput = document.getElementById('rememberMe');

      if (!emailInput || !passwordInput) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const remember = rememberInput ? rememberInput.checked : true;

      if (!email || !password) {
        showToast('Mohon masukkan email dan kata sandi Anda.', 'warning');
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());

      if (!user) {
        showToast('Email belum terdaftar. Periksa kembali email Anda atau daftar akun baru.', 'danger');
        return;
      }

      if (user.passwordHash !== simpleHash(password)) {
        showToast('Kata sandi salah. Silakan coba lagi.', 'danger');
        return;
      }

      // Verifikasi role mutlak dari database (bukan dari input form, nama user, atau URL)
      const verifiedRole = user.role;

      // Catat waktu login berhasil ke database riil
      const updatedUser = recordSuccessfulLogin(user.id) || user;
      State.currentUser = updatedUser;
      localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(updatedUser));
      localStorage.setItem(STORAGE_KEYS.REMEMBER, remember ? 'true' : 'false');

      // Routing berdasarkan verifiedRole dari database
      if (verifiedRole === 'admin') {
        showToast(`Selamat datang Pengurus Admin Koperasi, ${updatedUser.name}!`, 'success');
        State.adminTab = 'dashboard';
        renderApp();
      } else if (verifiedRole === 'supplier') {
        showToast(`Selamat datang Supplier, ${updatedUser.businessName || updatedUser.name}!`, 'success');
        State.supplierTab = 'products';
        renderApp();
      } else if (verifiedRole === 'user') {
        showToast(`Selamat datang kembali, ${updatedUser.name}!`, 'success');
        switchTab('home');
      } else {
        showToast(`Selamat datang, ${updatedUser.name}!`, 'info');
        switchTab('home');
      }
    }

    function handleUserLogin(e) { handleUnifiedLogin(e); }
    function handleSupplierLogin(e) { handleUnifiedLogin(e); }

    let selectedPaymentType = 'qris'; // 'qris', 'transfer_bank', 'paylater'
    let selectedTenor = '14_days'; // '14_days', '1_month', '2_months', '3_months'
    let orderNotes = '';

    window.selectedPaymentType = selectedPaymentType;
    window.selectedTenor = selectedTenor;

    // Helper: Perhitungan detail PayLater P ANDAI (Bunga Flat 3% per Bulan)
    function calculatePayLaterDetails(principal, tenor, baseDate = new Date()) {
      const cleanPrincipal = Math.max(0, Math.round(Number(principal) || 0));
      let ratePercent = 0;
      let months = 0;
      let installmentCount = 1;
      let tenorName = '14 Hari (Bunga 0%)';
      let daysList = [14];

      if (tenor === '1_month') {
        ratePercent = 3;
        months = 1;
        installmentCount = 1;
        tenorName = '1 Bulan (Bunga 3%)';
        daysList = [30];
      } else if (tenor === '2_months') {
        ratePercent = 6;
        months = 2;
        installmentCount = 2;
        tenorName = '2 Bulan (Bunga Total 6%)';
        daysList = [30, 60];
      } else if (tenor === '3_months') {
        ratePercent = 9;
        months = 3;
        installmentCount = 3;
        tenorName = '3 Bulan (Bunga Total 9%)';
        daysList = [30, 60, 90];
      } else {
        // Default: 14_days
        tenor = '14_days';
        ratePercent = 0;
        months = 0;
        installmentCount = 1;
        tenorName = '14 Hari (Bunga 0%)';
        daysList = [14];
      }

      // Rumus Bunga Flat Sederhana: bunga total = pokok tagihan * ratePercent / 100
      const interestAmount = Math.round(cleanPrincipal * (ratePercent / 100));
      const totalDue = cleanPrincipal + interestAmount;

      // Pembulatan ke integer rupiah: cicilan awal di-floor, sisa dialokasikan ke cicilan terakhir
      const baseInstallment = Math.floor(totalDue / installmentCount);
      const schedule = [];
      let allocatedSoFar = 0;

      for (let i = 1; i <= installmentCount; i++) {
        const isLast = (i === installmentCount);
        const amount = isLast ? (totalDue - allocatedSoFar) : baseInstallment;
        allocatedSoFar += amount;

        const days = daysList[i - 1] || (i * 30);
        const dueObj = new Date(baseDate.getTime());
        dueObj.setDate(dueObj.getDate() + days);
        const dueDateStr = dueObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

        schedule.push({
          installmentNo: i,
          amount: amount,
          dueDate: dueDateStr,
          daysFromNow: days,
          status: 'pending'
        });
      }

      return {
        tenor,
        tenorName,
        ratePercent,
        months,
        installmentCount,
        principal: cleanPrincipal,
        interestAmount,
        totalDue,
        schedule
      };
    }
    window.calculatePayLaterDetails = calculatePayLaterDetails;

    function getPageScrollTop() {
      return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function restorePageScrollTop(top) {
      window.scrollTo(0, top);
      if (document.documentElement) document.documentElement.scrollTop = top;
      if (document.body) document.body.scrollTop = top;
      requestAnimationFrame(() => {
        window.scrollTo(0, top);
        if (document.documentElement) document.documentElement.scrollTop = top;
        if (document.body) document.body.scrollTop = top;
      });
    }

    function selectPaymentType(type, evt) {
      if (evt && evt.preventDefault) evt.preventDefault();
      const currentScroll = getPageScrollTop();
      selectedPaymentType = type;
      window.selectedPaymentType = type;
      renderApp();
      restorePageScrollTop(currentScroll);
    }
    window.selectPaymentType = selectPaymentType;

    function selectTenorMethod(tenor, evt) {

    }

      const activeTenor = (typeof window !== 'undefined' && window.selectedTenor) ? window.selectedTenor : selectedTenor;

      // PayLater Calculation (Bunga Flat 3% per Bulan)

      const calc14 = calculatePayLaterDetails(subtotal, '14_days');
      const calc1m = calculatePayLaterDetails(subtotal, '1_month');

      const calc3m = calculatePayLaterDetails(subtotal, '3_months');

      return `

              <!-- 3. KOPERASI PAYLATER (BNPL) -->
              <div class="tenor-box ${activePaymentType === 'paylater' ? 'selected' : ''}" onclick="selectPaymentType('paylater', event)">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <div class="fw-bold text-dark" style="font-size: 0.85rem;"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Koperasi PayLater (Talangan Plafon Limit)</div>

                            <div class="text-muted" style="font-size:0.72rem;">Bunga ${formatRupiah(calc1m.interestAmount)} • Dibayar 1x (Jatuh tempo 30 hari)</div>
                          </div>
                        </div>
                        <div class="text-end">
                          <span class="fw-bold text-dark">${formatRupiah(calc1m.totalDue)}</span>
                          <div class="text-muted" style="font-size:0.68rem;">1x ${formatRupiah(calc1m.totalDue)}</div>
                        </div>
                      </div>
                    </div>

                    <!-- 3. 2 BULAN (BUNGA TOTAL 6%) -->
                    <div class="p-2 rounded-3 cursor-pointer ${activeTenor === '2_months' ? 'border border-2 border-success bg-white shadow-sm' : 'border border-light-subtle bg-white text-muted'}" onclick="selectTenorMethod('2_months', event)">
                      <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                          <i class="bi ${activeTenor === '2_months' ? 'bi-check-circle-fill text-success' : 'bi-circle text-muted'} fs-5"></i>
                          <div>
                            <strong class="text-dark small d-block">2 Bulan — Bunga Total 6% (2x Cicilan)</strong>
                            <div class="text-muted" style="font-size:0.72rem;">Bunga flat 3%/bln (${formatRupiah(calc2m.interestAmount)}) • 2x ${formatRupiah(calc2m.schedule[0].amount)}/bln</div>
                          </div>
                        </div>
                        <div class="text-end">
                          <span class="fw-bold text-dark">${formatRupiah(calc2m.totalDue)}</span>
                          <div class="text-muted" style="font-size:0.68rem;">2x ${formatRupiah(calc2m.schedule[0].amount)}</div>
                        </div>
                      </div>
                    </div>

                    <!-- 4. 3 BULAN (BUNGA TOTAL 9%) -->
                    <div class="p-2 rounded-3 cursor-pointer ${activeTenor === '3_months' ? 'border border-2 border-success bg-white shadow-sm' : 'border border-light-subtle bg-white text-muted'}" onclick="selectTenorMethod('3_months', event)">
                      <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                          <i class="bi ${activeTenor === '3_months' ? 'bi-check-circle-fill text-success' : 'bi-circle text-muted'} fs-5"></i>
                          <div>
                            <strong class="text-dark small d-block">3 Bulan — Bunga Total 9% (3x Cicilan)</strong>
                            <div class="text-muted" style="font-size:0.72rem;">Bunga flat 3%/bln (${formatRupiah(calc3m.interestAmount)}) • 3x cicilan termin</div>
                          </div>
                        </div>
                        <div class="text-end">
                          <span class="fw-bold text-dark">${formatRupiah(calc3m.totalDue)}</span>
                          <div class="text-muted" style="font-size:0.68rem;">3x termin</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Limit Sufficiency Alert -->
            ${activePaymentType === 'paylater' ? (!isLimitSufficient ? `
              <div class="alert alert-danger mt-3 mb-0 p-2" style="font-size: 0.76rem;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <strong>Sisa limit Anda tidak mencukupi!</strong><br>
                Sisa limit saat ini: ${formatRupiah(remainingLimit)}, sedangkan belanja: ${formatRupiah(subtotal)}. 
                Silakan kurangi jumlah belanja, ajukan kenaikan limit, atau pilih metode Bayar Langsung (QRIS / Transfer Bank).
              </div>
            ` : `
              <div class="alert alert-success mt-3 mb-0 p-2" style="font-size: 0.76rem;">
                <i class="bi bi-check-circle-fill me-1"></i>
                Limit Anda mencukupi! Setelah transaksi ini, sisa limit Anda menjadi <strong>${formatRupiah(remainingLimit - subtotal)}</strong>.
              </div>
            `) : `
              <div class="alert alert-info mt-3 mb-0 p-2" style="font-size: 0.76rem;">
                <i class="bi bi-info-circle-fill me-1"></i>
                Pembayaran langsung tidak memotong plafon limit belanja. Setelah pesanan dibuat, Anda dapat mengunggah bukti bayar untuk diverifikasi Admin Koperasi.
              </div>
            `}
          </div>

          <!-- RINGKASAN BIAYA -->
          <div class="pandai-card mb-4">
            <div class="fw-bold text-dark mb-2 small">Ringkasan Pembayaran</div>
            <div class="d-flex justify-content-between text-muted small mb-1">
              <span>Pokok Tagihan (Subtotal Belanja)</span>
              <span>${formatRupiah(subtotal)}</span>
            </div>
            <div class="d-flex justify-content-between text-muted small mb-1">
              <span>Ongkir Armada Koperasi</span>
              <span class="text-success fw-semibold">Gratis (Subsidi)</span>
            </div>
            ${activePaymentType === 'paylater' ? `
              <div class="d-flex justify-content-between text-muted small mb-1">
                <span>Suku Bunga Koperasi</span>
                <span class="${interestRate > 0 ? 'text-primary' : 'text-success'} fw-semibold">${interestRate}% flat (${interestRate === 0 ? 'Bebas Bunga' : `${interestRate / (paylaterCalc.months || 1)}%/bulan`})</span>
              </div>
              <div class="d-flex justify-content-between text-muted small mb-1">
                <span>Jumlah Bunga Rupiah</span>
                <span>${formatRupiah(interestAmount)}</span>
              </div>
              <div class="d-flex justify-content-between text-muted small mb-1">
                <span>Skema Cicilan</span>
                <span class="fw-semibold text-dark">${paylaterCalc.installmentCount}x Pembayaran</span>
              </div>

              <!-- Rincian Jadwal Cicilan Transparan Sebelum Konfirmasi -->
              <div class="bg-light p-2 rounded-3 my-2 border">
                <div class="fw-semibold text-dark small mb-1" style="font-size:0.75rem;">
                  <i class="bi bi-calendar-check text-success me-1"></i> Jadwal & Nominal Pembayaran Cicilan:
                </div>
                <div class="d-flex flex-column gap-1">
                  ${paylaterCalc.schedule.map(s => `
                    <div class="d-flex justify-content-between align-items-center bg-white p-1 px-2 rounded border small" style="font-size:0.73rem;">
                      <span class="text-muted">Cicilan ke-${s.installmentNo} (Jatuh tempo: <strong>${s.dueDate}</strong>)</span>
                      <strong class="text-dark">${formatRupiah(s.amount)}</strong>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            <div class="border-top pt-2 mt-2 d-flex justify-content-between align-items-center">
              <div>
                <span class="fw-bold text-dark">Total Tagihan</span>
                <div class="text-muted" style="font-size:0.72rem;">${tenorLabel}</div>
              </div>
              <span class="fw-bold text-success fs-5">${formatRupiah(totalDue)}</span>
            </div>

            <button class="btn btn-pandai-accent w-100 py-3 mt-3 fw-bold fs-6 ${!isLimitSufficient ? 'disabled' : ''}" onclick="submitOrderCheckout(${subtotal}, ${totalDue})">
              <i class="bi bi-bag-check-fill me-1"></i> Konfirmasi Pesanan Sekarang
            </button>
          </div>
        </div>
      `;
    }

    function addToCart(productId, qty = 1) {
      const prod = State.products.find(p => p.id === productId);
      if (!prod) return;

      const existing = State.cart.find(c => c.productId === productId);
      if (existing) {
        existing.qty += qty;
      } else {
        State.cart.push({ productId, qty });
      }

      State.saveCart();
      showToast(`${prod.name} (${qty}) ditambahkan ke keranjang`, 'success');
      renderApp();
    }

    function updateCartQty(productId, delta) {
      const existing = State.cart.find(c => c.productId === productId);
      if (existing) {
        existing.qty += delta;
        if (existing.qty <= 0) {
          State.cart = State.cart.filter(c => c.productId !== productId);
        }
        State.saveCart();
        renderApp();
      }
    }

    function removeFromCart(productId) {
      State.cart = State.cart.filter(c => c.productId !== productId);
      State.saveCart();
      showToast('Item berhasil dihapus dari keranjang', 'info');
      renderApp();
    }

    function clearCart() {
      State.cart = [];
      State.saveCart();
      renderApp();
    }

    let isSubmittingCheckout = false;

    function submitOrderCheckout(subtotal, totalDue) {
      if (isSubmittingCheckout) return;
      isSubmittingCheckout = true;

      try {
        const user = State.currentUser;
        if (!user || user.role !== 'user') {
          showToast('Akses ditolak: Hanya akun Mitra Warung yang dapat melakukan pemesanan sembako.', 'danger');
          return;
        }

        if (!State.cart || State.cart.length === 0) {
          showToast('Keranjang belanja Anda masih kosong. Silakan pilih produk dari katalog.', 'warning');
          return;
        }

        // 1. Validasi Stok dan Harga Riil Langsung dari Database (State.products)
        let validatedSubtotal = 0;
        const validatedCartItems = [];

        for (const c of State.cart) {
          const prod = State.products.find(p => p.id === c.productId);
          if (!prod) {
            showToast('Salah satu produk di keranjang tidak ditemukan di database.', 'danger');
            return;
          }
          if (prod.stock < c.qty) {
            showToast(`Stok untuk "${prod.name}" tidak mencukupi (Tersedia: ${prod.stock} ${prod.unit}, diminta: ${c.qty}).`, 'warning');
            return;
          }

          const itemPrice = Number(prod.supplierPrice);
          const itemSubtotal = itemPrice * c.qty;
          validatedSubtotal += itemSubtotal;

          validatedCartItems.push({
            productId: prod.id,
            name: prod.name,
            qty: c.qty,
            unit: prod.unit || 'Unit',
            price: itemPrice,
            subtotal: itemSubtotal,
            supplierId: prod.supplierId || 'sup_001',
            supplierName: prod.supplierName || 'PT Pangan Nusantara Grosir',
            status: 'Menunggu Konfirmasi'
          });
        }

        const activePaymentType = (typeof window !== 'undefined' && window.selectedPaymentType) ? window.selectedPaymentType : selectedPaymentType;
        const activeTenor = (typeof window !== 'undefined' && window.selectedTenor) ? window.selectedTenor : selectedTenor;

        const isBNPL = activePaymentType === 'paylater';
        let realTotalDue = validatedSubtotal;
        let orderPaymentMethod = 'QRIS Resmi PANDAI';
        let orderPaymentStatus = 'Menunggu Pembayaran';
        let paylaterCalc = null;

        if (activePaymentType === 'qris') {
          orderPaymentMethod = 'QRIS Resmi PANDAI';
          orderPaymentStatus = 'Menunggu Pembayaran';
          realTotalDue = validatedSubtotal;
        } else if (activePaymentType === 'transfer_bank') {
          orderPaymentMethod = 'Transfer Bank BRI';
          orderPaymentStatus = 'Menunggu Pembayaran';
          realTotalDue = validatedSubtotal;
        } else {
          // paylater: perhitungan bunga flat 3% per bulan
          paylaterCalc = calculatePayLaterDetails(validatedSubtotal, activeTenor);
          realTotalDue = paylaterCalc.totalDue;
          orderPaymentMethod = `Koperasi PayLater (${paylaterCalc.tenorName})`;
          orderPaymentStatus = 'Terverifikasi (BNPL Koperasi)';
        }

        const currentRemLimit = user.remainingLimit !== undefined ? user.remainingLimit : INITIAL_CREDIT_LIMIT;
        if (isBNPL && currentRemLimit < validatedSubtotal) {
          showToast(`Limit kredit tidak mencukupi (Sisa limit: ${formatRupiah(currentRemLimit)}, Total belanja: ${formatRupiah(validatedSubtotal)}).`, 'danger');
          return;
        }

        const orderId = 'ORD-2026-' + Math.floor(1000 + Math.random() * 9000);
        const nowStr = getNowFormattedString();

        const uniqueSupplierIds = [...new Set(validatedCartItems.map(i => i.supplierId))];
        const supplierConfirmations = {};
        uniqueSupplierIds.forEach(sId => {
          supplierConfirmations[sId] = {
            status: 'Menunggu Konfirmasi',
            confirmedAt: null,
            rejectedAt: null,
            rejectionReason: ''
          };
        });

        // 2. Buat Objek Pesanan Resmi
        const newOrder = {
          id: orderId,
          userId: user.id,
          buyerName: user.name,
          businessName: user.businessName,
          buyerPhone: user.phone,
          shippingAddress: user.address,
          shippingNotes: orderNotes || '',
          date: nowStr,
          timestamp: Date.now(),
          lastUpdated: nowStr,
          items: validatedCartItems,
          supplierIds: uniqueSupplierIds,
          supplierConfirmations: supplierConfirmations,
          subtotal: validatedSubtotal,
          deliveryFee: 0,
          total: realTotalDue,
          paymentMethod: orderPaymentMethod,
          paymentStatus: orderPaymentStatus,
          paymentProof: null,
          paylaterDetails: isBNPL ? {
            tenor: activeTenor,
            tenorName: paylaterCalc.tenorName,
            ratePercent: paylaterCalc.ratePercent,
            interestAmount: paylaterCalc.interestAmount,
            principal: paylaterCalc.principal,
            totalDue: paylaterCalc.totalDue,
            installmentCount: paylaterCalc.installmentCount,
            schedule: paylaterCalc.schedule
          } : null,
          paymentVerificationHistory: [
            {
              action: 'ORDER_CREATED',
              timestamp: nowStr,
              actor: user.name,
              notes: isBNPL ? `Pesanan dibuat dengan fasilitas ${orderPaymentMethod}` : `Pesanan dibuat dengan metode ${orderPaymentMethod}`
            }
          ],
          status: 'Menunggu Konfirmasi Supplier',
          deliveryMethod: '',
          deliverySchedule: '',
          courierName: '',
          courierPhone: '',
          trackingNumber: '',
          deliveryNotes: '',
          trackingSteps: createCanonicalTrackingSteps(nowStr)
        };

        State.orders.unshift(newOrder);
        State.saveOrders();

        // 3. Jika BNPL, buat kontrak cicilan dan potong limit
        if (isBNPL) {
          const contractNo = 'CK-2026-' + Math.floor(100 + Math.random() * 900);
          const finalDueDate = paylaterCalc.schedule[paylaterCalc.schedule.length - 1].dueDate;
          const initialDaysLeft = paylaterCalc.schedule[0].daysFromNow;

          const newInstallment = {

    /* ==========================================================================
       QRIS CODE GENERATOR & DIGITAL PAYMENT UTILITIES (EMVCo STANDARD)
       ========================================================================== */
    let qrisTimerInterval = null;

    function startQRISTimer(durationSeconds = 900) {
      if (qrisTimerInterval) clearInterval(qrisTimerInterval);
      let timer = durationSeconds;

      function update() {
        const target = document.getElementById('qrisCountdownText');
        if (!target) {
          clearInterval(qrisTimerInterval);
          return;
        }
        const mins = Math.floor(timer / 60);
        const secs = timer % 60;
        const str = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
        target.textContent = str;
        if (timer <= 0) {
          clearInterval(qrisTimerInterval);
          target.textContent = 'Kedaluwarsa (Perbarui)';
        }
        timer--;
      }

      update();
      qrisTimerInterval = setInterval(update, 1000);
    }

    // Build standard Indonesian QRIS (EMVCo MPM) Payload with CRC-16 Checksum
    function buildQRISPayload(merchantName = 'PANDAI', nmid = 'ID1026622161325', amount = 0, invoiceNo = 'CK-001') {
      function emvTag(id, val) {
        const str = String(val);
        const len = str.length;
        const lenStr = (len < 10 ? '0' : '') + len;
        return id + lenStr + str;
      }

      function calcCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
          crc ^= str.charCodeAt(c) << 8;
          for (let i = 0; i < 8; i++) {
            if (crc & 0x8000) {
              crc = (crc << 1) ^ 0x1021;
            } else {
              crc = crc << 1;
            }
            crc &= 0xFFFF;
          }
        }
        let hex = crc.toString(16).toUpperCase();
        while (hex.length < 4) hex = '0' + hex;
        return hex;
      }

      let payload = '';
      payload += emvTag('00', '01'); // Format Indicator
      payload += emvTag('01', '12'); // Point of Initiation: Dynamic
      const mai = emvTag('00', 'ID.CO.QRIS.WWW') + emvTag('01', nmid);
      payload += emvTag('26', mai);
      payload += emvTag('52', '5411'); // MCC Grocery Store
      payload += emvTag('53', '360');  // Currency IDR
      payload += emvTag('54', String(amount)); // Nominal
      payload += emvTag('58', 'ID');   // Country
      payload += emvTag('59', merchantName.substring(0, 20)); // Merchant
      payload += emvTag('60', 'JAKARTA'); // City
      payload += emvTag('61', '12520');   // Postal Code
      payload += emvTag('62', emvTag('01', invoiceNo.substring(0, 20))); // Invoice/Contract
      
      const beforeCRC = payload + '6304';
      return beforeCRC + calcCRC16(beforeCRC);
    }

    // Render Real Scannable QR Code using QRCodeJS (with SVG fallback)
    function renderQRISIntoContainer(containerId, amount, invoiceNo) {
      setTimeout(() => {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        const payload = buildQRISPayload('PANDAI', 'ID1026622161325', amount, invoiceNo);

        if (typeof QRCode !== 'undefined') {
          try {
            new QRCode(container, {
              text: payload,
              width: 190,
              height: 190,
              colorDark: '#0F172A',
              colorLight: '#FFFFFF',
              correctLevel: QRCode.CorrectLevel.M
            });
            return;
          } catch(e) {
            console.warn('QRCodeJS error, falling back to SVG:', e);
          }
        }

        // Fallback: render SVG
        container.innerHTML = generateQRIS_Fallback_SVG(amount, invoiceNo);
      }, 50);
    }

      return `

    function copyToClipboard(text, msg = 'Berhasil disalin ke clipboard!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(msg, 'success');
        }).catch(() => {
          fallbackCopyText(text, msg);
        });
      } else {
        fallbackCopyText(text, msg);
      }
    }

    function fallbackCopyText(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(msg, 'success');
      } catch(e) {
        showToast('Teks: ' + text, 'info');
      }
      document.body.removeChild(ta);
    }

      const canvas = container.querySelector('canvas');

      if (canvas) {
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('Gambar QRIS berhasil diunduh ke galeri!', 'success');

        const a = document.createElement('a');
        a.download = filename;
        a.href = img.src;

        showToast('Gambar QRIS berhasil diunduh ke galeri!', 'success');

    // Interactive Camera Scan Simulation
    function simulateScanCamera(installmentId) {
      showToast('📷 Menghubungkan scanner kamera ke QRIS Resmi PANDAI...', 'info');
      setTimeout(() => {
        showToast('Memverifikasi data pembayaran dengan sistem kliring QRIS...', 'warning');
      }, 700);
      setTimeout(() => {
        confirmSimulatedPayment(installmentId, 'QRIS Resmi PANDAI (Scan Kamera)');
      }, 1500);
    }

    function confirmSimulatedPayment(installmentId, selectedMethod = 'QRIS Resmi PANDAI (NMID: ID1026622161325)') {
      const inst = State.installments.find(i => i.id === installmentId);
      if (!inst) return;

      const user = State.currentUser;
      const amountPaid = inst.remainingAmount;

      // Update installment
      inst.remainingAmount = 0;
      inst.status = 'paid';
      inst.payments.unshift({
        date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
        amount: amountPaid,
        method: selectedMethod
      });
      State.saveInstallments();

      // Restore user limit
      user.remainingLimit = Math.min(user.creditLimit, (user.remainingLimit || 0) + amountPaid);
      user.creditScore = Math.min(100, (user.creditScore || 88) + 3);

      const allUsers = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const uIdx = allUsers.findIndex(u => u.id === user.id);
      if (uIdx !== -1) {
        allUsers[uIdx].remainingLimit = user.remainingLimit;
        allUsers[uIdx].creditScore = user.creditScore;
        State.saveUsers(allUsers);
      }
      localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(user));

      if (qrisTimerInterval) clearInterval(qrisTimerInterval);
      closeModal();
      showToast(`Pembayaran ${selectedMethod} ${formatRupiah(amountPaid)} sukses! Limit dikembalikan dan skor naik menjadi ${user.creditScore}!`, 'success');
      renderApp();
    }

    function resetProofFileInput() {
      const input = document.getElementById('proofFileInput');
      const container = document.getElementById('proofFilePreviewContainer');
      if (input) input.value = '';
      if (container) container.classList.add('d-none');
    }
    window.resetProofFileInput = resetProofFileInput;

    function handleProofFileSelected(input) {
      const file = input.files && input.files[0];
      const container = document.getElementById('proofFilePreviewContainer');
      const img = document.getElementById('proofPreviewImg');
      const pdfAlert = document.getElementById('proofPdfPreview');
      const nameEl = document.getElementById('proofPreviewFileName');
      const sizeEl = document.getElementById('proofPreviewFileSize');
      if (!file || !container) return;

      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
      const ext = file.name.split('.').pop().toLowerCase();
      const allowedExts = ['jpg', 'jpeg', 'png', 'webp', 'pdf'];
      if (!allowedExts.includes(ext) && !allowedTypes.includes(file.type)) {
        showToast('Format file tidak didukung! Gunakan format JPG, PNG, WEBP, atau PDF.', 'danger');
        input.value = '';
        container.classList.add('d-none');
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showToast('Ukuran file melebihi batas maksimal 5 MB! Silakan pilih file yang lebih kecil.', 'danger');
        input.value = '';
        container.classList.add('d-none');
        return;
      }

      container.classList.remove('d-none');
      if (nameEl) nameEl.textContent = file.name;
      if (sizeEl) sizeEl.textContent = `Ukuran: ${(file.size / 1024).toFixed(1)} KB`;

      if (file.type === 'application/pdf' || ext === 'pdf') {
        if (img) img.classList.add('d-none');
        if (pdfAlert) pdfAlert.classList.remove('d-none');
      } else {
        if (pdfAlert) pdfAlert.classList.add('d-none');
        if (img) {
          img.classList.remove('d-none');
          const reader = new FileReader();
          reader.onload = e => { img.src = e.target.result; };
          reader.readAsDataURL(file);
        }
      }
    }
    window.handleProofFileSelected = handleProofFileSelected;

    let isSubmittingPaymentProof = false;

    function handleUploadPaymentProof(e, orderId) {
      if (e && e.preventDefault) e.preventDefault();
      if (isSubmittingPaymentProof) return;

      const current = State.currentUser;
      if (!current) return;

      if (current.role === 'supplier') {
        showToast('Akses ditolak: Rekanan Supplier tidak berwenang mengunggah bukti pembayaran customer.', 'danger');
        return;
      }

      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      if (current.role === 'user' && order.userId !== current.id) {
        showToast('Akses ditolak: Anda hanya dapat mengunggah bukti untuk pesanan Anda sendiri.', 'danger');
        return;
      }

      const fileInput = document.getElementById('proofFileInput');
      const file = fileInput && fileInput.files ? fileInput.files[0] : null;

      if (!file && !order.paymentProof) {
        showToast('Silakan pilih berkas bukti pembayaran terlebih dahulu!', 'warning');
        return;
      }

      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          showToast('Ukuran file terlalu besar! Maksimal 5 MB.', 'danger');
          return;
        }

        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
        const ext = file.name.split('.').pop().toLowerCase();
        const allowedExts = ['jpg', 'jpeg', 'png', 'webp', 'pdf'];
        if (!allowedExts.includes(ext) && !allowedTypes.includes(file.type)) {
          showToast('Format file tidak didukung! Gunakan format JPG, PNG, WEBP, atau PDF.', 'danger');
          return;
        }
      }

      const progressIndicator = document.getElementById('proofUploadProgress');
      const submitBtn = document.getElementById('btnSubmitProof');
      if (progressIndicator) progressIndicator.classList.remove('d-none');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Mengunggah...';
      }

      isSubmittingPaymentProof = true;

      const senderBank = (document.getElementById('proofSenderBank') ? document.getElementById('proofSenderBank').value : '').trim();
      const senderName = (document.getElementById('proofSenderName') ? document.getElementById('proofSenderName').value : '').trim();
      const notes = (document.getElementById('proofNotes') ? document.getElementById('proofNotes').value : '').trim();

      const completeUpload = (fileData, fileName, fileType, fileSize) => {
        try {
          const nowStr = getNowFormattedString();

          order.paymentProof = {
            fileData: fileData || (order.paymentProof ? order.paymentProof.fileData : ''),
            fileName: fileName || (order.paymentProof ? order.paymentProof.fileName : 'bukti_pembayaran.jpg'),
            fileType: fileType || (order.paymentProof ? order.paymentProof.fileType : 'image/jpeg'),
            fileSize: fileSize || (order.paymentProof ? order.paymentProof.fileSize : 0),
            senderBank: senderBank || (order.paymentProof ? order.paymentProof.senderBank : ''),
            senderName: senderName || (order.paymentProof ? order.paymentProof.senderName : current.name),
            notes: notes || (order.paymentProof ? order.paymentProof.notes : ''),
            uploadedAt: nowStr,
            timestamp: Date.now()
          };

          // Aturan: status pembayaran berubah menjadi Menunggu Verifikasi (TIDAK langsung Terverifikasi)
          order.paymentStatus = 'Menunggu Verifikasi';
          order.paymentRejectionReason = '';
          order.paymentVerificationHistory = order.paymentVerificationHistory || [];
          order.paymentVerificationHistory.push({
            action: 'UPLOAD_PROOF',
            timestamp: nowStr,
            actor: current.name,
            role: current.role,
            notes: `Bukti transfer diunggah (${order.paymentProof.fileName}, ${Math.round(order.paymentProof.fileSize / 1024)} KB)`
          });

          State.saveOrders();
          showToast('Bukti pembayaran berhasil diunggah! Status pesanan kini: Menunggu Verifikasi Admin.', 'success');
          
          // Tampilkan langsung bukti terunggah dan status terkini di Halaman Pembayaran
          openOrderPaymentInstructionModal(order.id);
          renderApp();
        } catch (err) {
          console.error('Error saving payment proof:', err);
          showToast('Gagal menyimpan bukti pembayaran: Memori penyimpanan lokal browser penuh.', 'danger');
        } finally {
          isSubmittingPaymentProof = false;
          if (progressIndicator) progressIndicator.classList.add('d-none');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-1"></i> Unggah Bukti Pembayaran';
          }
        }
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const ext = file.name.split('.').pop().toLowerCase();
          completeUpload(event.target.result, file.name, file.type || ('image/' + ext), file.size);
        };
        reader.onerror = function() {
          isSubmittingPaymentProof = false;
          if (progressIndicator) progressIndicator.classList.add('d-none');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-1"></i> Unggah Bukti Pembayaran';
          }
          showToast('Gagal membaca berkas bukti pembayaran.', 'danger');
        };
        reader.readAsDataURL(file);
      } else if (order.paymentProof) {
        completeUpload();
      }
    }
    window.handleUploadPaymentProof = handleUploadPaymentProof;

      if (!current || current.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang dapat melakukan tindakan ini.', 'danger');
        return;
      }

        <div class="p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-dark">Tolak Bukti Pembayaran</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

    function handleAdminRejectPaymentSubmit(e, orderId) {
      e.preventDefault();
      const reason = (document.getElementById('adminRejectReasonDetail') ? document.getElementById('adminRejectReasonDetail').value : '').trim() || 'Bukti pembayaran ditolak oleh Admin Koperasi';
      handleAdminVerifyPayment(orderId, false, reason);
    }

    function handleAdminVerifyPayment(orderId, isApproved, rejectionReason = '') {
      const current = State.currentUser;
      if (!current || current.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang dapat memverifikasi pembayaran.', 'danger');
        return;
      }

      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      const nowStr = getNowFormattedString();
      order.paymentVerificationHistory = order.paymentVerificationHistory || [];

      if (isApproved) {
        order.paymentStatus = 'Terverifikasi';
        order.paymentRejectionReason = '';
        order.paymentVerificationHistory.push({
          action: 'VERIFIED',
          timestamp: nowStr,
          adminId: current.id,
          adminName: current.name,
          notes: 'Pembayaran disetujui & diverifikasi valid oleh Admin Koperasi'
        });
        // Sesuai aturan bisnis: Verifikasi pembayaran oleh Admin TIDAK mengubah status pengiriman Supplier
        State.saveOrders();
        closeModal();
        showToast(`Pembayaran pesanan #${orderId} telah diverifikasi (Terverifikasi)!`, 'success');
      } else {
        order.paymentStatus = 'Ditolak';
        order.paymentRejectionReason = rejectionReason;
        order.paymentVerificationHistory.push({
          action: 'REJECTED',
          timestamp: nowStr,
          adminId: current.id,
          adminName: current.name,
          reason: rejectionReason,
          notes: `Pembayaran ditolak: ${rejectionReason}`
        });
        State.saveOrders();
        closeModal();
        showToast(`Pembayaran pesanan #${orderId} ditolak. Customer dapat mengunggah bukti ulang.`, 'warning');
      }

      renderApp();
    }

    function handleAdminSavePaymentConfig(e) {
      if (e && e.preventDefault) e.preventDefault();
      const current = State.currentUser;
      if (!current || current.role !== 'admin') {
        showToast('Akses ditolak: Hanya Admin Koperasi yang dapat mengubah konfigurasi pembayaran.', 'danger');
        return;
      }

      const bankName = (document.getElementById('cfgBankName') ? document.getElementById('cfgBankName').value : '').trim();
      const bankAccountNo = (document.getElementById('cfgBankAccountNo') ? document.getElementById('cfgBankAccountNo').value : '').trim();
      const bankAccountHolder = (document.getElementById('cfgBankAccountHolder') ? document.getElementById('cfgBankAccountHolder').value : '').trim();
      const qrisMerchantName = (document.getElementById('cfgQrisMerchantName') ? document.getElementById('cfgQrisMerchantName').value : '').trim();

    // Aksi Konfirmasi Penerimaan Barang oleh Warung
    function confirmOrderReceivedByWarung(orderId) {
      const order = State.orders.find(o => o.id === orderId);
      if (!order) {
        showToast('Pesanan tidak ditemukan.', 'danger');
        return;
      }

      if (!State.currentUser || (State.currentUser.role !== 'user' && State.currentUser.role !== 'admin')) {
        showToast('Akses ditolak: Hanya pembeli (Mitra Warung) atau Admin yang dapat mengonfirmasi penerimaan.', 'danger');
        return;
      }

      if (State.currentUser.role === 'user' && order.userId !== State.currentUser.id) {
        showToast('Akses ditolak: Anda bukan pemilik pesanan ini.', 'danger');
        return;
      }

      const nowStr = getNowFormattedString();

      // Update 7 tahapan pelacakan
      if (!order.trackingSteps || order.trackingSteps.length !== 7) {
        order.trackingSteps = createCanonicalTrackingSteps(order.date);
      }

      // Step 5 shipping active: false
      order.trackingSteps[4].active = false;

      // Step 6: Pesanan Diterima di Warung -> Done
      order.trackingSteps[5].done = true;
      order.trackingSteps[5].time = nowStr;
      order.trackingSteps[5].active = false;

      // Step 7: Pesanan Selesai -> Done
      order.trackingSteps[6].done = true;
      order.trackingSteps[6].time = nowStr;
      order.trackingSteps[6].active = false;

      order.status = 'Pesanan Selesai';
      order.lastUpdated = nowStr;
      State.saveOrders();

      showToast(`Pesanan #${order.id} berhasil dikonfirmasi telah diterima. Transaksi selesai!`, 'success');
      renderApp();
    }

    function handleRepeatOrder(orderId) {
      const order = State.orders.find(o => o.id === orderId);
      if (!order) return;

      // Add all order items to cart
      order.items.forEach(item => {
        const existing = State.cart.find(c => c.productId === item.productId);
        if (existing) {
          existing.qty += item.qty;
        } else {
          State.cart.push({ productId: item.productId, qty: item.qty });
        }
      });

      State.saveCart();
      showToast(`Berhasil menambahkan ${order.items.length} produk dari pesanan #${order.id} ke keranjang!`, 'success');
      switchTab('cart');
    }

        showToast('Akses ditolak: Supplier tidak memiliki kewenangan melihat data limit customer.', 'danger');
        return;

      if (current.role === 'user' && targetId !== current.id) {
        showToast('Akses ditolak: Anda hanya dapat melihat riwayat limit akun Anda sendiri.', 'danger');
        return;
      }

      const allUsers = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
      const user = allUsers.find(u => u.id === targetId) || (targetId === current.id ? current : null);
